<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu Anime - Undercover</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        input, button, select { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
        button { background: #6200ee; color: white; cursor: pointer; }
        button:hover { background: #3700b3; }
        .card { background: #1e1e1e; padding: 20px; margin: 10px auto; width: 300px; border-radius: 8px; }
        ul { list-style: none; padding: 0; }
        li { margin: 5px 0; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Jeu Undercover Anime</h1>
        <input type="text" id="username" placeholder="Votre Pseudo"><br>
        <input type="text" id="roomCode" placeholder="Code du salon"><br>
        <select id="subMode">
            <option value="normal">Mode Classique (Paires)</option>
            <option value="hardcore">Mode Hardcore (Personnages Aléatoires)</option>
        </select><br>
        <button onclick="joinRoom()">Rejoindre</button>
    </div>

    <div id="lobby-screen" class="hidden">
        <h2>Salon : <span id="display-room"></span></h2>
        <h3>Joueurs connectés :</h3>
        <ul id="players-list"></ul>
        <button id="start-btn" class="hidden" onclick="startGame()">Lancer la partie</button>
    </div>

    <div id="game-screen" class="hidden">
        <h2>Phase de jeu</h2>
        <div class="card">
            <p id="secret-word-box"></p>
        </div>
        <div id="gameplay-area">
            <p id="turn-info"></p>
            <div id="clue-input-section" class="hidden">
                <input type="text" id="clue-input" placeholder="Votre indice...">
                <button onclick="submitClue()">Envoyer</button>
            </div>
            <div id="end-clues-section" class="hidden">
                <button onclick="forceVoting()">Lancer le vote</button>
            </div>
        </div>
        
        <div id="voting-section" class="hidden">
            <h3>Phase de Vote</h3>
            <div id="voting-buttons"></div>
        </div>

        <div id="results-section" class="hidden">
            <h3 id="result-title"></h3>
            <p id="result-desc"></p>
            <button id="next-round-btn" class="hidden" onclick="nextStepGame()">Continuer</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = '';
        let currentRoomCode = '';

        function joinRoom() {
            const username = document.getElementById('username').value.trim();
            const roomCode = document.getElementById('roomCode').value.trim();
            const subMode = document.getElementById('subMode').value;

            if (!username || !roomCode) return alert('Remplissez tous les champs.');

            currentRoomCode = roomCode;
            socket.emit('join_room', { roomCode, username, mode: 'undercover', subMode });

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('display-room').innerText = roomCode;
        }

        function startGame() {
            socket.emit('start_game', currentRoomCode);
        }

        function submitClue() {
            const clue = document.getElementById('clue-input').value.trim();
            if (!clue) return alert('Écrivez un indice.');
            socket.emit('submit_clue', { roomCode: currentRoomCode, clue });
            document.getElementById('clue-input').value = '';
        }

        function forceVoting() {
            socket.emit('force_start_voting', { roomCode: currentRoomCode });
        }

        function castVote(targetId) {
            socket.emit('cast_vote', { roomCode: currentRoomCode, targetId });
            document.getElementById('voting-section').classList.add('hidden');
            document.getElementById('turn-info').innerText = "Vote enregistré. En attente des autres joueurs...";
        }

        function nextStepGame() {
            socket.emit('next_step_game', currentRoomCode);
        }

        socket.on('connect', () => { myId = socket.id; });

        socket.on('update_room', (room) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            room.players.forEach(p => {
                let li = document.createElement('li');
                li.innerText = p.name + (p.id === room.host ? ' (Hôte)' : '');
                list.appendChild(li);
            });
            if (room.host === myId) {
                document.getElementById('start-btn').classList.remove('hidden');
            }
        });

        socket.on('launch_reveal', (room) => {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('voting-section').classList.add('hidden');
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById('gameplay-area').classList.remove('hidden');
            
            const me = room.players.find(p => p.id === myId);
            const wordBox = document.getElementById('secret-word-box');
            
            if (me.isImpostor) {
                wordBox.innerHTML = `⚠️ <strong>Tu es l'Impostor !</strong><br>Ton mot secret : ${me.secretData}`;
            } else {
                wordBox.innerHTML = `🛡️ <strong>Civil</strong><br>Ton mot secret : ${me.secretData}`;
            }

            setTimeout(() => {
                updateGameplayUI(room);
            }, 4000);
        });

        function updateGameplayUI(room) {
            const currentTurnPlayer = room.players[room.currentTurnIndex];
            const turnInfo = document.getElementById('turn-info');
            const inputSection = document.getElementById('clue-input-section');

            if (currentTurnPlayer) {
                turnInfo.innerText = `Tour de : ${currentTurnPlayer.name} (${currentTurnPlayer.clue ? 'A donné son indice ✅' : 'En train d\'écrire...'})`;
                if (currentTurnPlayer.id === myId && currentTurnPlayer.isAlive) {
                    inputSection.classList.remove('hidden');
                } else {
                    inputSection.classList.add('hidden');
                }
            }
        }

        socket.on('update_gameplay', (room) => {
            updateGameplayUI(room);
        });

        socket.on('resume_gameplay', (room) => {
            document.getElementById('voting-section').classList.add('hidden');
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById('gameplay-area').classList.remove('hidden');
            updateGameplayUI(room);
        });

        socket.on('prompt_end_clue_options_undercover', (room) => {
            document.getElementById('turn-info').innerText = "Tous les indices ont été donnés !";
            document.getElementById('clue-input-section').classList.add('hidden');
            document.getElementById('end-clues-section').classList.remove('hidden');
        });

        socket.on('start_voting', (room) => {
            document.getElementById('gameplay-area').classList.add('hidden');
            document.getElementById('voting-section').classList.remove('hidden');
            
            const votingButtons = document.getElementById('voting-buttons');
            votingButtons.innerHTML = '';

            room.players.forEach(p => {
                if (p.id !== myId && p.isAlive) {
                    let btn = document.createElement('button');
                    btn.innerText = `Voter contre ${p.name}`;
                    btn.onclick = () => castVote(p.id);
                    votingButtons.appendChild(btn);
                }
            });
        });

        socket.on('show_results', ({ room, eliminatedPlayer, gameOver, winnerMessage }) => {
            document.getElementById('voting-section').classList.add('hidden');
            const resultsSection = document.getElementById('results-section');
            resultsSection.classList.remove('hidden');

            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const nextBtn = document.getElementById('next-round-btn');

            if (gameOver) {
                title.innerText = "Fin de la partie";
                desc.innerHTML = `${winnerMessage}`;
            } else {
                title.innerText = "Résultat du vote";
                if (eliminatedPlayer) {
                    desc.innerHTML = `Le joueur éliminé est <strong>${eliminatedPlayer.name}</strong>.<br>` +
                                     `Il était ${eliminatedPlayer.isImpostor ? 'un ⚠️ <strong>Imposteur</strong>' : 'un 🛡️ <strong>Civil</strong>'}.`;
                } else {
                    desc.innerText = "Égalité ou pas de vote décisif. Personne n'a été éliminé.";
                }
            }

            if (room.host === myId) {
                nextBtn.classList.remove('hidden');
                nextBtn.innerText = gameOver ? "Recommencer une partie" : "Manche suivante";
            }
        });
    </script>
</body>
</html>
