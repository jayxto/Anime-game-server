<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Game</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffcc00;
            font-style: italic;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
        }
        .main-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #181824;
            border: 2px solid #28283d;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card h2 {
            color: #ffcc00;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            background: #232333;
            color: white;
            border: 1px solid #3a3a55;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #777799;
        }
        .btn-join {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-join:hover {
            background: #ff6b81;
        }
        .modes-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .mode-card {
            background: #212130;
            border: 1px solid #33334d;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mode-info h3 {
            margin: 0 0 5px 0;
            color: #fff;
            font-size: 16px;
        }
        .mode-info p {
            margin: 0;
            color: #8888aa;
            font-size: 12px;
        }
        .btn-create {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-create:hover {
            background: #ff6b81;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>ANIME GAME</h1>
    <div class="subtitle">Crée ou rejoins une salle avec tes amis.</div>

    <div class="main-container" id="menuContainer">
        <!-- Bloc Rejoindre une salle (avec pseudo en dessous du code comme tu le souhaites) -->
        <div class="card">
            <h2>Rejoindre une salle</h2>
            <div class="input-group">
                <input type="text" id="roomCodeInput" placeholder="CODE (EX: AB12)">
                <input type="text" id="usernameInput" placeholder="Ton pseudo">
                <button class="btn-join" onclick="joinExistingRoom()">Rejoindre</button>
            </div>
        </div>

        <!-- Bloc Création des modes séparés -->
        <div class="card">
            <h2>Créer une partie</h2>
            <div class="modes-grid">
                <!-- Undercover Normal -->
                <div class="mode-card">
                    <div class="mode-info">
                        <h3>Undercover</h3>
                        <p>Normal (Paires classiques)</p>
                    </div>
                    <button class="btn-create" onclick="createNewRoom('undercover', 'normal')">Créer</button>
                </div>

                <!-- Undercover Hardcore -->
                <div class="mode-card">
                    <div class="mode-info">
                        <h3>Undercover</h3>
                        <p>Hardcore (Multi-animes + Sans imposteur)</p>
                    </div>
                    <button class="btn-create" onclick="createNewRoom('undercover', 'hardcore')">Créer</button>
                </div>

                <!-- Devine la note -->
                <div class="mode-card">
                    <div class="mode-info">
                        <h3>Devine la note</h3>
                        <p>Mode classique</p>
                    </div>
                    <button class="btn-create" onclick="createNewRoom('note', 'normal')">Créer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteneur du salon d'attente (jeu) -->
    <div id="gameContainer" class="hidden" style="width: 100%; max-width: 450px;">
        <div class="card" style="text-align: center;">
            <h2 id="roomDisplayCode"></h2>
            <div id="playerList" style="margin: 15px 0; text-align: left;"></div>
            <button id="startGameBtn" class="btn-join hidden" onclick="startGame()">Lancer la partie</button>
        </div>
    </div>

    <!-- Script Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomData = null;

        function createNewRoom(mode, subMode) {
            let username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert("Entre ton pseudo avant de créer une salle !");
                return;
            }
            // Génère un code aléatoire si aucun code n'est saisi dans l'input du haut
            let roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!roomCode) {
                roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
                document.getElementById('roomCodeInput').value = roomCode;
            }

            socket.emit('join_room', { roomCode, username, mode, subMode });
        }

        function joinExistingRoom() {
            let username = document.getElementById('usernameInput').value.trim();
            let roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!username || !roomCode) {
                alert("Entre ton pseudo et un code de salle !");
                return;
            }
            socket.emit('join_room', { roomCode, username, mode: 'undercover', subMode: 'normal' });
        }

        function startGame() {
            if (currentRoomData) {
                socket.emit('start_game', currentRoomData.code);
            }
        }

        socket.on('update_room', (room) => {
            currentRoomData = room;
            document.getElementById('menuContainer').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomDisplayCode').innerText = `Salle : ${room.code}`;

            let listHtml = '<strong>Joueurs connectés :</strong><ul style="padding-left: 20px; margin-top: 5px;">';
            room.players.forEach(p => {
                listHtml += `<li>${p.name} ${p.id === room.host ? '👑' : ''}</li>`;
            });
            listHtml += '</ul>';
            document.getElementById('playerList').innerHTML = listHtml;

            if (room.host === socket.id && room.status === 'waiting') {
                document.getElementById('startGameBtn').classList.remove('hidden');
            } else {
                document.getElementById('startGameBtn').classList.add('hidden');
            }
        });

        socket.on('launch_reveal', (room) => {
            alert("La partie est lancée !");
        });
    </script>
</body>
</html>
