<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Game</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffcc00;
            font-style: italic;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .section-box {
            background: #1a1a24;
            border: 2px solid #2a2a3d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .mode-card {
            background: #222233;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #3a3a55;
        }
        .mode-card h3 {
            margin-top: 0;
            color: #ff4757;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input {
            background: #2f2f45;
            color: white;
            border: 1px solid #444466;
        }
        button {
            background: #ff4757;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1 id="gameTitle">ANIME GAME</h1>
    <p id="gameSubtitle">Crée ou rejoins une salle avec tes amis.</p>

    <div class="container" id="menuContainer">
        <!-- Section Rejoindre -->
        <div class="section-box">
            <h3>Rejoindre une salle</h3>
            <input type="text" id="usernameInput" placeholder="Ton pseudo">
            <input type="text" id="roomCodeInput" placeholder="CODE (EX: AB12)">
            <button onclick="joinExistingRoom()">Rejoindre</button>
        </div>

        <!-- Section Modes de jeu séparés -->
        <div class="section-box">
            <h3>Mode Multijoueur</h3>

            <!-- 1. Undercover Normal -->
            <div class="mode-card">
                <h3>Undercover</h3>
                <p style="font-size: 14px; color: #aaa;">Normal (Paires classiques)</p>
                <button onclick="createNewRoom('undercover', 'normal')">Créer</button>
            </div>

            <!-- 2. Undercover Hardcore -->
            <div class="mode-card">
                <h3>Undercover</h3>
                <p style="font-size: 14px; color: #aaa;">Hardcore (Multi-animes + Sans imposteur)</p>
                <button onclick="createNewRoom('undercover', 'hardcore')">Créer</button>
            </div>

            <!-- 3. Devine la note -->
            <div class="mode-card">
                <h3>Devine la note</h3>
                <button onclick="createNewRoom('note', 'normal')">Créer</button>
            </div>
        </div>
    </div>

    <!-- Conteneur du jeu (pour afficher les écrans de salon / partie) -->
    <div id="gameContainer" class="hidden" style="width: 100%; max-width: 500px;">
        <div id="roomInfo" class="section-box">
            <h2 id="roomDisplayCode"></h2>
            <div id="playerList"></div>
            <button id="startGameBtn" class="hidden" onclick="startGame()">Lancer la partie</button>
        </div>
    </div>

    <!-- Script Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomData = null;

        function createNewRoom(mode, subMode) {
            let username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert("Entre un pseudo avant de créer une salle !");
                return;
            }
            let roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!roomCode) {
                roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
                document.getElementById('roomCodeInput').value = roomCode;
            }

            socket.emit('join_room', { roomCode, username, mode, subMode });
        }

        function joinExistingRoom() {
            let username = document.getElementById('usernameInput').value.trim();
            let roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!username || !roomCode) {
                alert("Entre ton pseudo et un code de salle !");
                return;
            }
            socket.emit('join_room', { roomCode, username, mode: 'undercover', subMode: 'normal' });
        }

        function startGame() {
            if (currentRoomData) {
                socket.emit('start_game', currentRoomData.code);
            }
        }

        socket.on('update_room', (room) => {
            currentRoomData = room;
            document.getElementById('menuContainer').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            document.getElementById('roomDisplayCode').innerText = `Salle : ${room.code} (${room.mode} - ${room.subMode})`;

            let listHtml = '<h4>Joueurs connectés :</h4><ul>';
            room.players.forEach(p => {
                listHtml += `<li>${p.name} ${p.id === room.host ? '👑' : ''}</li>`;
            });
            listHtml += '</ul>';
            document.getElementById('playerList').innerHTML = listHtml;

            // Afficher le bouton lancer si on est l'hôte
            if (room.host === socket.id && room.status === 'waiting') {
                document.getElementById('startGameBtn').classList.remove('hidden');
            } else {
                document.getElementById('startGameBtn').classList.add('hidden');
            }
        });

        socket.on('launch_reveal', (room) => {
            alert("La partie commence ! Rôle et mots attribués.");
        });
    </script>
</body>
</html>
