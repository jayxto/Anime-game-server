name: Restore legacy image coverage
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Restore old image library
        run: |
          git fetch origin backup-before-image-reset-2026-10-02
          rm -rf /tmp/ag-backup
          git worktree add --detach /tmp/ag-backup origin/backup-before-image-reset-2026-10-02
          mkdir -p music/legacy-images music/char-images
          rsync -a /tmp/ag-backup/assets/images/ music/legacy-images/
      - name: Canonicalize known images
        run: node scripts/phase1-restore-images.mjs
      - name: Verify server syntax
        run: node --check server.js
      - name: Commit restored images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js music/char-images music/legacy-images PHASE1_IMAGE_REPORT.json
          git commit -m "fix: restore legacy images and canonicalize known portraits" || true
          git push origin HEAD:image-coverage-100-v1
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-image-report
          path: PHASE1_IMAGE_REPORT.json
