name: Clean old missing catalog

on:
  push:
    branches: [image-audit-work]
    paths:
      - '.github/workflows/CLEAN_OLD_MISSING_CATALOG.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-audit-work
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - run: python3 .github/clean_old_missing_catalog.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/cleaned_old_missing_catalog.txt .github/cleaned_old_missing_catalog.json
          git commit -m "audit: record cleaned old missing catalog [skip ci]"
          git push origin HEAD:image-audit-work
