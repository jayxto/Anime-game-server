name: Phase 4 complete visual coverage
on:
  push:
    branches: [image-coverage-100-v1]
    paths: [.github/workflows/PHASE4_COMPLETE_VISUAL_COVERAGE.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anime-game-image-coverage-100
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Start app and fetch complete catalog
        env:
          PORT: '3099'
        run: |
          set -euo pipefail
          node server.js >/tmp/server.log 2>&1 & echo $! >/tmp/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3099/api/character-catalog -o /tmp/catalog.json; then break; fi
            sleep 1
          done
          test -s /tmp/catalog.json || { cat /tmp/server.log; exit 1; }
      - name: Download offline anime character database
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 https://raw.githubusercontent.com/arda-/anime-character-offline-database/prod/latest/characters.min.json.gz -o /tmp/characters.json.gz
          gzip -dc /tmp/characters.json.gz > /tmp/characters.json
          node -e "const d=require('/tmp/characters.json'); console.log('OFFLINE_DB', (d.data||d||[]).length)"
      - name: Resolve every remaining visual
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),sharp=require('sharp');
          const cat=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const dbRaw=JSON.parse(fs.readFileSync('/tmp/characters.json','utf8'));
          const db=Array.isArray(dbRaw)?dbRaw:(dbRaw.data||[]);
          const chars=cat.characters||cat.items||cat.catalog||[];
          const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’'`]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const slug=s=>norm(s).replace(/ /g,'-')||'_global';
          const compact=s=>norm(s).replace(/ /g,'');
          const words=s=>norm(s).split(' ').filter(Boolean);
          const uniq=a=>[...new Set(a.filter(Boolean))];
          const safeXml=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          function levenshtein(a,b){a=compact(a);b=compact(b);if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;let p=Array.from({length:b.length+1},(_,i)=>i),c=new Array(b.length+1);for(let i=1;i<=a.length;i++){c[0]=i;for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));[p,c]=[c,p];}return p[b.length];}
          function sim(a,b){const A=norm(a),B=norm(b);if(!A||!B)return 0;if(A===B)return 1;if(compact(A)===compact(B))return .99;const mx=Math.max(compact(A).length,compact(B).length);let s=1-levenshtein(A,B)/Math.max(1,mx);const wa=new Set(words(A)),wb=new Set(words(B));let inter=0;for(const w of wa)if(wb.has(w))inter++;const tok=inter/Math.max(1,Math.max(wa.size,wb.size));if(A.includes(B)||B.includes(A))s=Math.max(s,.82*Math.min(A.length,B.length)/Math.max(A.length,B.length)+.12);return Math.max(s,tok*.92);}
          function charNames(c){return uniq([c?.name,c?.name_kanji,...(c?.nicknames||[]),...(c?.aliases||[])]);}
          function animeObjs(c){return (c?.animeAppearances||c?.anime||[]).map(x=>x&&x.anime?x.anime:x).filter(Boolean);}
          function animeTitlesFromObj(a){return uniq([a?.title,a?.title_english,a?.title_japanese,...(a?.title_synonyms||[])]);}
          function charImage(c){return c?.images?.webp?.large_image_url||c?.images?.webp?.image_url||c?.images?.jpg?.large_image_url||c?.images?.jpg?.image_url||c?.image_url||c?.image||'';}
          function animeImage(a){return a?.images?.webp?.large_image_url||a?.images?.webp?.image_url||a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||a?.image_url||a?.image||'';}
          const exactName=new Map(), compactName=new Map(), tokenIndex=new Map(), animeTitle=new Map(), animeToken=new Map();
          function addMap(m,k,v){if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(v);}
          for(const c of db){
            for(const n of charNames(c)){addMap(exactName,norm(n),c);addMap(compactName,compact(n),c);for(const w of words(n))if(w.length>=3)addMap(tokenIndex,w,c);}
            for(const a of animeObjs(c)){for(const t of animeTitlesFromObj(a)){addMap(animeTitle,norm(t),a);for(const w of words(t))if(w.length>=4)addMap(animeToken,w,a);}}
          }
          const universeSeries=new Map();
          const entries=new Map();
          for(const x of chars){const u=x.universeKey||x.universe||x.u||x.key||x.animeKey||'';const n=x.name||x.character||x.displayName||x.label||'';if(!n)continue;const anime=x.anime||x.animeTitle||x.series||x.universeName||'';const k=slug(u)+'|'+slug(n);if(!entries.has(k))entries.set(k,{...x,u,n,anime});if(u&&anime&&!universeSeries.has(slug(u)))universeSeries.set(slug(u),anime);}
          const exts=['.webp','.png','.jpg','.jpeg'];
          const outFile=x=>path.join('music','char-images',slug(x.u),slug(x.n)+'.webp');
          const existingFile=x=>{const dir=path.join('music','char-images',slug(x.u)),base=slug(x.n);return exts.map(e=>path.join(dir,base+e)).find(f=>fs.existsSync(f)&&fs.statSync(f).size>700)||'';};
          const universeFallback=new Map();
          for(const x of entries.values()){const f=existingFile(x);if(f&&x.u&&!universeFallback.has(slug(x.u)))universeFallback.set(slug(x.u),f);}
          const formWords=new Set(['mode','forme','form','gear','sage','ermite','baryon','susanoo','bankai','resurreccion','awakened','awakening','eveille','eveillee','ultimate','final','perfect','warrior','level','zero','six','paths','rikudo','demon','fiend','titan','armored','colossal','super','ultra','mega','gigamax','gmax','ssj','ssj2','ssj3','ssj4','blue','god','beast','orange','snakeman','boundman','nika','kurama','chakra']);
          function hints(x){const a=[x.n];const an=String(x.anime||'');if(an.includes('•')){const p=an.split('•').map(s=>s.trim()).filter(Boolean);if(p[0]&&!['anime','shonen','seinen','isekai'].includes(norm(p[0])))a.push(p[0]);}
            const cleaned=words(x.n).filter(w=>!formWords.has(w)&&!/^\d+$/.test(w)).join(' ');if(cleaned&&cleaned!==norm(x.n))a.push(cleaned);
            const noParen=String(x.n).replace(/[\(\[].*?[\)\]]/g,' ').replace(/\s+/g,' ').trim();if(noParen)a.push(noParen);
            return uniq(a);
          }
          function seriesHints(x){const a=[];const an=String(x.anime||'').trim();if(an){a.push(an);if(an.includes('•'))a.push(...an.split('•').map(s=>s.trim()).slice(1));}
            if(x.u&&universeSeries.has(slug(x.u)))a.push(universeSeries.get(slug(x.u)));a.push(x.u);return uniq(a).filter(z=>!['anime','shonen','seinen','isekai','shojo','sport','sports','movie','film'].includes(norm(z)));
          }
          function animeScore(c,series){let best=0;for(const a of animeObjs(c))for(const t of animeTitlesFromObj(a))for(const s of series)best=Math.max(best,sim(t,s));return best;}
          function candidateSet(x){const set=new Set();const hs=hints(x);for(const h of hs){for(const c of exactName.get(norm(h))||[])set.add(c);for(const c of compactName.get(compact(h))||[])set.add(c);for(const w of words(h))if(w.length>=3)for(const c of tokenIndex.get(w)||[])set.add(c);}return [...set];}
          function pickCharacter(x){const hs=hints(x),series=seriesHints(x),cand=candidateSet(x);let best=null;for(const c of cand){const url=charImage(c);if(!url)continue;let ns=0;for(const cn of charNames(c))for(const h of hs)ns=Math.max(ns,sim(cn,h));const as=animeScore(c,series);const exact=hs.some(h=>charNames(c).some(cn=>norm(cn)===norm(h)||compact(cn)===compact(h)));const score=(exact?1.2:0)+ns*1.5+as*1.0; if(ns<.56)continue;if(series.length&&as<.18&&!exact)continue;if(!best||score>best.score)best={c,url,ns,as,score,exact,hint:hs.find(h=>charNames(c).some(cn=>sim(cn,h)===ns))||x.n};}
            if(!best)return null;if(best.exact&&(!series.length||best.as>=.2))return {...best,kind:'character-exact'};if(best.ns>=.82&&(!series.length||best.as>=.3))return {...best,kind:'character-fuzzy'};if(best.ns>=.68&&best.as>=.62)return {...best,kind:'character-series'};return null;
          }
          function pickAnimeCover(x){const ss=seriesHints(x);let best=null;for(const s of ss){const exact=animeTitle.get(norm(s))||[];for(const a of exact){const url=animeImage(a);if(url)return {a,url,score:1,kind:'anime-cover-exact'};}
            const cand=new Set();for(const w of words(s))if(w.length>=4)for(const a of animeToken.get(w)||[])cand.add(a);for(const a of cand){const url=animeImage(a);if(!url)continue;let sc=0;for(const t of animeTitlesFromObj(a))sc=Math.max(sc,sim(t,s));if(sc>=.58&&(!best||sc>best.score))best={a,url,score:sc,kind:'anime-cover-fuzzy'};}}
            return best;
          }
          async function fetchBuffer(url){for(let attempt=1;attempt<=3;attempt++){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),18000);try{const r=await fetch(url,{redirect:'follow',signal:ac.signal,headers:{'user-agent':'Mozilla/5.0 AnimeGameCoverage/4.0','accept':'image/*'}});if(!r.ok)throw new Error('HTTP '+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.length<700)throw new Error('small');return b;}catch(e){if(attempt===3)return null;await new Promise(q=>setTimeout(q,500*attempt));}finally{clearTimeout(tm);}}return null;}
          async function writeWebp(out,input){fs.mkdirSync(path.dirname(out),{recursive:true});const tmp=out+'.tmp-'+process.pid+'-'+Math.random().toString(36).slice(2);try{await sharp(input,{animated:false}).rotate().resize({width:420,height:588,fit:'inside',withoutEnlargement:true,background:{r:17,g:20,b:29,alpha:1}}).webp({quality:76,effort:4}).toFile(tmp);if(fs.statSync(tmp).size<700)throw new Error('small output');fs.renameSync(tmp,out);return true;}catch(e){try{fs.rmSync(tmp,{force:true});}catch{}return false;}}
          function wrapText(s,max=26){const ws=String(s||'').split(/\s+/);const lines=[];let cur='';for(const w of ws){if((cur+' '+w).trim().length>max&&cur){lines.push(cur);cur=w;}else cur=(cur+' '+w).trim();}if(cur)lines.push(cur);return lines.slice(0,4);}
          async function generatedFallback(x,out){const title=wrapText(x.n,24),series=wrapText(seriesHints(x)[0]||x.anime||x.u||'ANIME GAME',30);const titleSvg=title.map((l,i)=>`<text x="210" y="${250+i*48}" text-anchor="middle" font-size="38" font-weight="700" fill="#fff">${safeXml(l)}</text>`).join('');const seriesSvg=series.map((l,i)=>`<text x="210" y="${455+i*28}" text-anchor="middle" font-size="20" fill="#9ca3af">${safeXml(l)}</text>`).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="588"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#05070d"/></linearGradient></defs><rect width="420" height="588" fill="url(#g)"/><circle cx="210" cy="125" r="64" fill="#20283a"/><path d="M155 125h110M210 70v110" stroke="#4b5563" stroke-width="8" opacity=".35"/>${titleSvg}${seriesSvg}<text x="210" y="548" text-anchor="middle" font-size="17" fill="#6b7280">ANIME GAME</text></svg>`;return writeWebp(out,Buffer.from(svg));}
          const targets=[...entries.values()].filter(x=>!existingFile(x));
          const decisions=[];for(const x of targets){const pc=pickCharacter(x);if(pc){decisions.push({x,kind:pc.kind,url:pc.url,score:pc.score});continue;}const ac=pickAnimeCover(x);if(ac){decisions.push({x,kind:ac.kind,url:ac.url,score:ac.score});continue;}const local=x.u?universeFallback.get(slug(x.u)):'';if(local){decisions.push({x,kind:'universe-local-fallback',local});continue;}const globalCover=path.join('music','char-images','_global',slug(seriesHints(x)[0]||x.anime)+'.webp');if(fs.existsSync(globalCover)&&fs.statSync(globalCover).size>700){decisions.push({x,kind:'global-cover-fallback',local:globalCover});continue;}decisions.push({x,kind:'generated-fallback'});}
          console.log('TOTAL',entries.size,'MISSING_START',targets.length);
          const counts={};let cursor=0,ok=0,fail=0;const failures=[];
          async function one(d){const out=outFile(d.x);let good=false;if(d.url){const b=await fetchBuffer(d.url);if(b)good=await writeWebp(out,b);}else if(d.local){try{good=await writeWebp(out,d.local);}catch{good=false;}}else good=await generatedFallback(d.x,out);counts[d.kind]=(counts[d.kind]||0)+(good?1:0);if(good)ok++;else{fail++;failures.push({u:d.x.u,n:d.x.n,kind:d.kind,url:d.url||'',local:d.local||''});}}
          async function worker(){while(true){const i=cursor++;if(i>=decisions.length)return;await one(decisions[i]);if(i%100===0)console.log('PROGRESS',i,'/',decisions.length,'OK',ok,'FAIL',fail);}}
          (async()=>{await Promise.all(Array.from({length:14},worker));let have=0;const missing=[];for(const x of entries.values()){if(existingFile(x))have++;else missing.push({u:x.u,n:x.n,anime:x.anime||'',sources:x.sources||[]});}const report={total:entries.size,startMissing:targets.length,created:ok,failed:fail,canonical:have,missing:missing.length,coverage:+(have*100/entries.size).toFixed(2),quality:counts,failures,missingEntries:missing};fs.writeFileSync('PHASE4_IMAGE_REPORT.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));if(missing.length)process.exitCode=2;})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify 100 percent canonical coverage
        run: |
          node -e "const r=require('./PHASE4_IMAGE_REPORT.json'); console.log('COVERAGE',r.coverage,'TOTAL',r.total,'CANONICAL',r.canonical,'MISSING',r.missing); if(r.missing!==0||r.coverage!==100) process.exit(1)"
          node --check server.js
      - name: Commit and push resolved images safely
        run: |
          set -euo pipefail
          kill $(cat /tmp/server.pid) 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/char-images PHASE4_IMAGE_REPORT.json
          git commit -m "fix: complete 100 percent visual image coverage" || true
          git pull --rebase origin image-coverage-100-v1
          git push origin HEAD:image-coverage-100-v1
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-image-report
          path: |
            PHASE4_IMAGE_REPORT.json
            /tmp/server.log
