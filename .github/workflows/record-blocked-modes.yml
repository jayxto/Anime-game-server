name: Record remaining Anime Game multiplayer modes
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/record-blocked-modes.yml'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - run: timeout 640s node promo/blocked-modes.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-missing-mode-attempts
          path: promo/blocked-output/
          if-no-files-found: warn
