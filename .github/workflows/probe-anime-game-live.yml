name: Verifier acces Reel Anime Game

on:
  push:
    branches:
      - capture-real-gameplay-20261019
    paths:
      - '.github/workflows/probe-anime-game-live.yml'

permissions:
  contents: read

jobs:
  verifier-acces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tester HTTP et inspecter la vraie page de connexion
        run: |
          set +e
          curl -IL -sS -o /dev/null --max-time 25 -w 'homepage=%{http_code}\n' https://anime-game-server.onrender.com/
          curl -IL -sS -o /dev/null --max-time 25 -w 'socketjs=%{http_code}\n' https://anime-game-server.onrender.com/socket.io/socket.io.js
          curl -LfsS --max-time 25 https://anime-game-server.onrender.com/ -o /tmp/live-site.html
          echo "HTML bytes: $(wc -c < /tmp/live-site.html)"
          echo 'Page TITLE and guest/login identifiers:'
          grep -Eoin '<title[^>]*>[^<]*|jouer en invit[^<]{0,100}|guest-pseudo|auth-screen|app-root|href=[^ >]{0,80}' /tmp/live-site.html | head -40
          echo 'First 500 characters:'
          head -c 500 /tmp/live-site.html
          echo
