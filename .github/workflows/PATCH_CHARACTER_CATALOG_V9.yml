name: Patch character catalog canonical cleanup v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_CHARACTER_CATALOG_V9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v9 catalog cleanup
        run: python3 .github/patch_character_catalog_v9.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify v9 anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHARACTER_CATALOG_CANONICAL_V9' server.js
          grep -q "if (u === 'fate') u = 'fatestay';" server.js
          grep -q "if (u === 'soul') u = 'souleater';" server.js
          grep -q 'isClearlyNonCharacterCatalogName' server.js
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_character_catalog_v9.py .github/workflows/PATCH_CHARACTER_CATALOG_V9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: canonicalize public character catalog v9 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

# rerun: robust arcAnime anchor
