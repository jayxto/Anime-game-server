name: Audit live character image catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_LIVE_CHARACTER_CATALOG.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Fetch live Render character catalogue
        run: python3 .github/audit_live_character_catalog.py
      - name: Commit live catalogue audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/live_character_catalog_audit.json .github/live_character_catalog_summary.txt
          if git diff --cached --quiet; then
            echo "No live catalogue audit changes"
            exit 0
          fi
          git commit -m "chore: audit live character image catalog [skip ci]"
          git push origin HEAD:main
