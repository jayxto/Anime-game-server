name: Patch visually verified character images v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_VERIFIED_CHARACTERS_VISUAL_V8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply visually verified replacements
        run: python3 .github/patch_verified_characters_visual_v8.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify image endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          urls=[
            'https://cdn.rafled.com/anime-icons/images/7z9SrV28Eit8hSVVG4isKIgt0OvUE8fT.jpg',
            'https://neoapo.com/images/character/41877/7659046d79639f9f430922abd7e996bd.webp',
            'https://cdn.gamerch.com/contents/wiki/4008/entry/idyh0sw9.jpg',
            'https://imgs.laipeitu.com/upload/2022/2022031311/58976.jpg',
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-4095','Accept':'image/*'})
            with urllib.request.urlopen(req,timeout=20) as r:
              ct=(r.headers.get('Content-Type') or '').lower()
              if r.status not in (200,206) or not ct.startswith('image/'):
                raise SystemExit(f'bad image response {r.status} {ct} {url}')
              print(r.status,ct,url)
          PY
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_VERIFIED_CHARACTER_VISUAL_BATCH8' server.js
          grep -q '7z9SrV28Eit8hSVVG4isKIgt0OvUE8fT.jpg' server.js
          grep -q '7659046d79639f9f430922abd7e996bd.webp' server.js
          grep -q 'idyh0sw9.jpg' server.js
          grep -q '2022031311/58976.jpg' server.js
      - name: Commit verified image batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_verified_characters_visual_v8.py .github/workflows/PATCH_VERIFIED_CHARACTERS_VISUAL_V8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: visually verify character portraits v8 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
