name: Patch QAP catalog categories

on:
  push:
    branches: [canonical-route-bridge-100]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-route-bridge-100
          fetch-depth: 0

      - name: Patch server catalog sources and admin catalog UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ----- server.js: preserve the exact QAP theme on every character -----
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          old = "add(u, anime, item.name, item.img || null, file.replace('.json',''));"
          new = "add(u, anime, item.name, item.img || null, file === 'qap-themes.json' ? ('qap:' + String(theme.id || theme.title || 'theme')) : file.replace('.json',''));"
          n = s.count(old)
          if n < 1:
              raise SystemExit('server.js: catalogue theme source line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('server.js patched:', n, 'matching line(s), first catalogue occurrence updated')

          # ----- index.html: state keeps QAP title map -----
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')

          old = "const state = { all: [], filtered: [], page: 0, status: new Map(), loaded: false };"
          new = "const state = { all: [], filtered: [], page: 0, status: new Map(), loaded: false, qapThemes: new Map() };"
          if old not in h:
              raise SystemExit('index.html: state marker not found')
          h = h.replace(old, new, 1)

          # Pretty labels for QAP and its themes.
          old = "const prettyMode = value => {\n        const raw = String(value || '').trim();\n        if (!raw) return 'Autre';\n        const k = raw.toLowerCase().replace(/[\\s-]+/g,'_');"
          new = "const prettyMode = value => {\n        const raw = String(value || '').trim();\n        if (!raw) return 'Autre';\n        if (raw === 'qap') return 'Qui a le plus';\n        if (raw.toLowerCase().startsWith('qap:')) return state.qapThemes.get(raw.slice(4)) || 'Qui a le plus';\n        const k = raw.toLowerCase().replace(/[\\s-]+/g,'_');"
          if old not in h:
              raise SystemExit('index.html: prettyMode marker not found')
          h = h.replace(old, new, 1)

          # Add the secondary theme selector just after the mode selector.
          old = '<select id=\\"ag-charadmin-mode\\"><option value=\\"\\">Tous les modes</option></select><select id=\\"ag-charadmin-anime\\">'
          new = '<select id=\\"ag-charadmin-mode\\"><option value=\\"\\">Tous les modes</option></select><select id=\\"ag-charadmin-qap-theme\\" style=\\"display:none\\"><option value=\\"\\">Tous les thèmes Qui a le plus</option></select><select id=\\"ag-charadmin-anime\\">'
          if old not in h:
              # Some versions do not keep escaped quotes in template literals.
              old = '<select id="ag-charadmin-mode"><option value="">Tous les modes</option></select><select id="ag-charadmin-anime">'
              new = '<select id="ag-charadmin-mode"><option value="">Tous les modes</option></select><select id="ag-charadmin-qap-theme" style="display:none"><option value="">Tous les thèmes Qui a le plus</option></select><select id="ag-charadmin-anime">'
          if old not in h:
              raise SystemExit('index.html: mode selector marker not found')
          h = h.replace(old, new, 1)

          # Replace mode change handler with two-level category behavior.
          old = "document.getElementById('ag-charadmin-mode').addEventListener('change', apply);"
          new = "document.getElementById('ag-charadmin-mode').addEventListener('change',()=>{const mode=document.getElementById('ag-charadmin-mode')?.value||'';const sub=document.getElementById('ag-charadmin-qap-theme');if(sub){sub.style.display=mode==='qap'?'':'none';if(mode!=='qap')sub.value='';}apply();});\n        document.getElementById('ag-charadmin-qap-theme').addEventListener('change', apply);"
          if old not in h:
              raise SystemExit('index.html: mode change listener marker not found')
          h = h.replace(old, new, 1)

          # Build top-level modes without exposing qap:<id> as flat modes, then fill every QAP theme in the secondary selector.
          old = "const modeSel=document.getElementById('ag-charadmin-mode');\n            for(const m of [...new Set(state.all.flatMap(sourcesOf))].sort((a,b)=>prettyMode(a).localeCompare(prettyMode(b)))){const o=document.createElement('option');o.value=m;o.textContent=prettyMode(m);modeSel.appendChild(o)}\n            state.loaded=true;"
          new = "const modeSel=document.getElementById('ag-charadmin-mode');\n            const rawModes=[...new Set(state.all.flatMap(sourcesOf))];\n            for(const m of rawModes.filter(m=>!String(m).startsWith('qap:')).sort((a,b)=>prettyMode(a).localeCompare(prettyMode(b)))){const o=document.createElement('option');o.value=m;o.textContent=prettyMode(m);modeSel.appendChild(o)}\n            if(rawModes.some(m=>String(m).startsWith('qap:'))){const o=document.createElement('option');o.value='qap';o.textContent='Qui a le plus';modeSel.appendChild(o)}\n            try{const qr=await fetch('/api/qap/themes',{cache:'no-store'});const qd=await qr.json();if(qr.ok&&qd.ok&&Array.isArray(qd.themes)){const sub=document.getElementById('ag-charadmin-qap-theme');for(const t of qd.themes){const id=String(t.id||'').trim();if(!id)continue;state.qapThemes.set(id,String(t.title||id));const o=document.createElement('option');o.value=id;o.textContent=`${t.emoji||''} ${t.title||id}`.trim();sub.appendChild(o)}}}catch(_){}\n            state.loaded=true;"
          if old not in h:
              raise SystemExit('index.html: mode population marker not found')
          h = h.replace(old, new, 1)

          # Two-level filtering: mode=qap => all QAP characters, optional exact theme narrows it.
          old = "if(!state.loaded)return; const q=norm(document.getElementById('ag-charadmin-q')?.value); const anime=document.getElementById('ag-charadmin-anime')?.value||''; const mode=document.getElementById('ag-charadmin-mode')?.value||''; const wanted=document.getElementById('ag-charadmin-status')?.value||'';\n        state.filtered=state.all.filter(x=>{if(anime&&x.anime!==anime)return false;if(mode&&!sourcesOf(x).includes(mode))return false;if(q&&!norm(`${x.name} ${x.anime} ${sourcesOf(x).map(prettyMode).join(' ')}`).includes(q))return false;if(wanted&&state.status.get(keyOf(x))!==wanted)return false;return true});"
          new = "if(!state.loaded)return; const q=norm(document.getElementById('ag-charadmin-q')?.value); const anime=document.getElementById('ag-charadmin-anime')?.value||''; const mode=document.getElementById('ag-charadmin-mode')?.value||''; const qapTheme=document.getElementById('ag-charadmin-qap-theme')?.value||''; const wanted=document.getElementById('ag-charadmin-status')?.value||'';\n        state.filtered=state.all.filter(x=>{const src=sourcesOf(x);if(anime&&x.anime!==anime)return false;if(mode==='qap'&&!src.some(s=>String(s).startsWith('qap:')))return false;if(mode&&mode!=='qap'&&!src.includes(mode))return false;if(mode==='qap'&&qapTheme&&!src.includes('qap:'+qapTheme))return false;if(q&&!norm(`${x.name} ${x.anime} ${src.map(prettyMode).join(' ')}`).includes(q))return false;if(wanted&&state.status.get(keyOf(x))!==wanted)return false;return true});"
          if old not in h:
              raise SystemExit('index.html: apply filter marker not found')
          h = h.replace(old, new, 1)

          p.write_text(h, encoding='utf-8')
          print('index.html patched')
          PY

      - name: Validate patch
        shell: bash
        run: |
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          checks={
            'server qap source tags': "'qap:' + String(theme.id" in s,
            'QAP second selector': 'ag-charadmin-qap-theme' in h,
            'QAP top category': "o.value='qap';o.textContent='Qui a le plus'" in h,
            'QAP exact theme filter': "src.includes('qap:'+qapTheme)" in h,
            'QAP themes API': "fetch('/api/qap/themes'" in h,
          }
          for k,v in checks.items(): print(k, 'OK' if v else 'FAIL')
          if not all(checks.values()): raise SystemExit(1)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-qap-catalog-categories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js index.html .github/workflows/patch-qap-catalog-categories.yml
          git commit -m "feat: categorize Qui a le plus themes in image catalog [skip ci]"
          git push origin HEAD:canonical-route-bridge-100
