name: Patch verified transformation images V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_IMAGES_V2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch transformation image resolver and persistence
        run: python3 .github/patch_transform_images_v2.py

      - name: Verify server syntax
        run: node --check server.js

      - name: Verify important anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_IMAGES_V2' server.js
          grep -q 'persistQapTransformImage' server.js
          grep -q 'const persistKey = `v2|' server.js
          grep -q 'transform-verified' server.js

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_images_v2.py .github/workflows/PATCH_TRANSFORM_IMAGES_V2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: persist and verify transformation images [skip ci]"
          git push origin HEAD:main
