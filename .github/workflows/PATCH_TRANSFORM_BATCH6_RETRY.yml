name: Patch verified transformation batch 6 retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH6_RETRY.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch 6
        run: python3 .github/patch_transform_batch6.py
      - name: Verify syntax and marker
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -Fq 'QAP_VERIFIED_TRANSFORM_BATCH6' server.js
      - name: Commit batch 6
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch6.py .github/workflows/PATCH_TRANSFORM_BATCH6.yml .github/workflows/PATCH_TRANSFORM_BATCH6_RETRY.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 6 [skip ci]"
          git push origin HEAD:main
