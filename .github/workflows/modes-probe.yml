name: Probe match creation and gameplay
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/modes-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - run: timeout 135s node promo/modes-probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-modes-probe
          path: promo/modes-probe-output/
