name: Patch admin manual character image v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-admin-manual-character-image-v3.yml'

permissions:
  contents: write

concurrency:
  group: patch-admin-manual-character-image-v3
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add manual image editor to character admin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          SERVER = Path("server.js")
          UI = Path("assets/js/ui-refactor.js")

          server = SERVER.read_text(encoding="utf-8")
          ui = UI.read_text(encoding="utf-8")

          SERVER_MARK = "// PATCH ADMIN MANUAL CHARACTER IMAGE V3"
          UI_MARK = "/* Admin manual character image v3 */"

          if SERVER_MARK not in server:
              old = '''async function resolveCharacterImage(universeKey, displayName) {
              const fixed = staticCharImage(universeKey, displayName);
              if (fixed) return { imageUrl:fixed, sourceUrl:null, status:'ok' };'''
              new = '''async function resolveCharacterImage(universeKey, displayName) {
              // PATCH ADMIN MANUAL CHARACTER IMAGE V3
              // A link chosen by an admin always wins over an old static/local link.
              // It is persisted in character_images (Postgres), so it survives Render deploys.
              const manualName = cleanImageCharacterName(displayName);
              const manual = await getCachedCharacterImage(universeKey, manualName);
              if (manual?.imageUrl && manual?.sourceUrl === 'manual-admin') return manual;

              const fixed = staticCharImage(universeKey, displayName);
              if (fixed) return { imageUrl:fixed, sourceUrl:null, status:'ok' };'''
              if old not in server:
                  raise RuntimeError("resolveCharacterImage anchor not found")
              server = server.replace(old, new, 1)

              route = r'''
          // PATCH ADMIN MANUAL CHARACTER IMAGE V3
          // Permet à l'admin de remplacer immédiatement l'image d'un personnage.
          // Le lien est stocké dans Postgres via character_images.
          app.post('/api/admin/character-image', adminOnly(async (req, res) => {
              const b = req.body || {};
              const universe = String(b.universe || '').trim();
              const name = cleanImageCharacterName(String(b.name || '').trim()).slice(0, 120);
              const imageUrl = String(b.imageUrl || b.img || '').trim().slice(0, 1400);

              if (!ARC_UNIVERSE_ANIME[universe]) {
                  return res.status(400).json({ ok:false, error:'Anime invalide.' });
              }
              if (!name) {
                  return res.status(400).json({ ok:false, error:'Personnage invalide.' });
              }
              if (!/^https:\/\/\S+$/i.test(imageUrl)) {
                  return res.status(400).json({ ok:false, error:"Le lien doit commencer par https://" });
              }

              await saveCachedCharacterImage(universe, name, {
                  imageUrl,
                  sourceUrl:'manual-admin',
                  status:'ok'
              });

              try {
                  CHARACTER_IMAGE_RETRY_AT.delete(`${universe}|${normalizeImageKey(name)}`);
              } catch (_) {}

              res.json({ ok:true, universe, name, imageUrl });
          }));

          '''
              anchor = "/* ---------- API : citations ---------- */"
              if anchor not in server:
                  raise RuntimeError("admin citations anchor not found")
              server = server.replace(anchor, route + anchor, 1)

          if UI_MARK not in ui:
              css_anchor = '''.ag-charcard-actions{display:flex;gap:5px;margin-top:7px}.ag-charcard-actions button,.ag-charcard-actions a{flex:1;font-size:.68rem;padding:6px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:inherit;text-decoration:none;text-align:center}
        .ag-charadmin-more{display:block;margin:14px auto 2px;padding:9px 18px}'''
              css_new = '''.ag-charcard-actions{display:flex;gap:5px;margin-top:7px}.ag-charcard-actions button,.ag-charcard-actions a{flex:1;font-size:.68rem;padding:6px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:inherit;text-decoration:none;text-align:center}
        /* Admin manual character image v3 */
        .ag-charfix{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.10)}
        .ag-charcard.bad .ag-charfix{display:block}
        .ag-charfix input{width:100%;font-size:.72rem;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:#0b1020;color:#fff}
        .ag-charfix button{width:100%;margin-top:6px;padding:7px 8px;border:0;border-radius:7px;background:#118a58;color:#fff;font-size:.72rem;font-weight:800;cursor:pointer}
        .ag-charfix button:disabled{opacity:.55;cursor:wait}
        .ag-charfix-msg{display:block;min-height:16px;margin-top:5px;font-size:.66rem;line-height:1.25}
        .ag-charadmin-more{display:block;margin:14px auto 2px;padding:9px 18px}'''
              if css_anchor not in ui:
                  raise RuntimeError("admin CSS anchor not found")
              ui = ui.replace(css_anchor, css_new, 1)

              old_html = '''c.innerHTML = `<span class="ag-charstate">${known === 'ok' ? 'OK' : known === 'bad' ? 'CASSÉE' : '…'}</span><img loading="lazy" referrerpolicy="no-referrer" src="${esc(img)}" alt="${esc(x.name)}"><div class="ag-charcard-copy"><b title="${esc(x.name)}">${esc(x.name)}</b><small title="${esc(x.anime)}">${esc(x.anime)}</small><div class="ag-charcard-actions"><button type="button" data-copy>Copier</button><a href="${esc(img)}" target="_blank" rel="noopener">Image</a></div></div>`;'''
              new_html = '''c.innerHTML = `<span class="ag-charstate">${known === 'ok' ? 'OK' : known === 'bad' ? 'CASSÉE' : '…'}</span><img loading="lazy" referrerpolicy="no-referrer" src="${esc(img)}" alt="${esc(x.name)}"><div class="ag-charcard-copy"><b title="${esc(x.name)}">${esc(x.name)}</b><small title="${esc(x.anime)}">${esc(x.anime)}</small><div class="ag-charcard-actions"><button type="button" data-copy>Copier</button><a href="${esc(img)}" target="_blank" rel="noopener" data-image-link>Image</a></div><div class="ag-charfix"><input type="url" inputmode="url" autocomplete="off" data-fix-url placeholder="Colle le lien https:// de l'image"><button type="button" data-fix-save>Mettre cette image</button><small class="ag-charfix-msg" data-fix-msg></small></div></div>`;'''
              if old_html not in ui:
                  raise RuntimeError("character card HTML anchor not found")
              ui = ui.replace(old_html, new_html, 1)

              handler_anchor = '''c.querySelector('[data-copy]').addEventListener('click', async () => { try { await navigator.clipboard.writeText(`${x.anime} — ${x.name}`); } catch (_) {} });
            grid.appendChild(c);'''
              handler_new = r'''c.querySelector('[data-copy]').addEventListener('click', async () => { try { await navigator.clipboard.writeText(`${x.anime} — ${x.name}`); } catch (_) {} });

            /* Admin manual character image v3 */
            const fixInput = c.querySelector('[data-fix-url]');
            const fixBtn = c.querySelector('[data-fix-save]');
            const fixMsg = c.querySelector('[data-fix-msg]');
            const imageLink = c.querySelector('[data-image-link]');

            fixBtn.addEventListener('click', async () => {
                const imageUrl = String(fixInput.value || '').trim();
                if (!/^https:\/\/\S+$/i.test(imageUrl)) {
                    fixMsg.textContent = '❌ Colle un lien qui commence par https://';
                    return;
                }
                if (!x.u) {
                    fixMsg.textContent = "❌ Anime non reconnu pour ce personnage.";
                    return;
                }

                fixBtn.disabled = true;
                fixBtn.textContent = 'Enregistrement…';
                fixMsg.textContent = 'Vérification et sauvegarde…';

                try {
                    const headers = (typeof authHeaders === 'function')
                        ? authHeaders(true)
                        : { 'Content-Type':'application/json' };

                    const r = await fetch('/api/admin/character-image', {
                        method:'POST',
                        headers,
                        body:JSON.stringify({
                            universe:x.u,
                            name:x.name,
                            imageUrl
                        })
                    });
                    const d = await r.json().catch(() => ({}));
                    if (!r.ok || !d.ok) throw new Error(d.error || `HTTP ${r.status}`);

                    x.img = imageUrl;
                    x.originalImg = imageUrl;
                    if (imageLink) imageLink.href = imageUrl;

                    fixMsg.textContent = '⏳ Test de la nouvelle image…';
                    im.onload = () => {
                        set('ok');
                        fixMsg.textContent = '✅ Image enregistrée';
                        fixInput.value = '';
                    };
                    im.onerror = () => {
                        set('bad');
                        fixMsg.textContent = "❌ Ce lien ne charge pas d'image";
                    };
                    im.src = imageUrl + (imageUrl.includes('?') ? '&' : '?') + 'ag_admin=' + Date.now();
                } catch (e) {
                    fixMsg.textContent = '❌ ' + (e?.message || 'Erreur');
                } finally {
                    fixBtn.disabled = false;
                    fixBtn.textContent = 'Mettre cette image';
                }
            });

            grid.appendChild(c);'''
              if handler_anchor not in ui:
                  raise RuntimeError("character card handler anchor not found")
              ui = ui.replace(handler_anchor, handler_new, 1)

          SERVER.write_text(server, encoding="utf-8")
          UI.write_text(ui, encoding="utf-8")
          print("Manual character image admin patch installed")
          PY

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check assets/js/ui-refactor.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js assets/js/ui-refactor.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: edit broken character images from admin"
          git push
