name: Patch catalog noncharacters V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_CATALOG_NONCHARACTERS_V4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch non-character ranking themes
        run: python3 .github/patch_catalog_noncharacters_v4.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify filter anchor
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHARACTER_CATALOG_NONCHAR_THEME_FILTER_V4' server.js
          grep -q "\['arc','anime','shonen','isekai'\]" server.js
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_catalog_noncharacters_v4.py .github/workflows/PATCH_CATALOG_NONCHARACTERS_V4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: exclude non-character ranking themes from image catalog [skip ci]'
          git push origin HEAD:main
