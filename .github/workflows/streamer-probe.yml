name: Probe real Anime Game UI
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/streamer-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - run: node promo/probe.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-ui-probe
          path: promo/probe-output/
          if-no-files-found: warn
