name: Audit transformation catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_TRANSFORM_CATALOG.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chunk exact transformation catalog
        run: python3 .github/audit_transform_catalog.py
      - name: Commit catalog chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/transform_items_*.txt
          git commit -m "chore: chunk transformation catalog audit [skip ci]"
          git push origin HEAD:main
