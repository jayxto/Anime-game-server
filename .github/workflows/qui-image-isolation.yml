name: Qui – couple and duo image isolation
on:
  pull_request:
    paths:
      - 'server.js'
      - 'index.html'
      - 'tests/qui-catalogue.test.cjs'
      - '.github/workflows/qui-image-isolation.yml'
  push:
    branches:
      - main
    paths:
      - 'server.js'
      - 'index.html'
      - 'tests/qui-catalogue.test.cjs'
      - '.github/workflows/qui-image-isolation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check server.js
      - run: node --test tests/qui-catalogue.test.cjs
