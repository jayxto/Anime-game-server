name: Phase 4B complete coverage retry
on:
  push:
    branches: [image-coverage-100-v1]
    paths: [.github/workflows/PHASE4B_COMPLETE_COVERAGE.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anime-game-image-coverage-100
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Start app and fetch catalog
        env:
          PORT: '3099'
        run: |
          set -euo pipefail
          node server.js >/tmp/server.log 2>&1 & echo $! >/tmp/server.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3099/api/character-catalog -o /tmp/catalog.json; then break; fi
            sleep 1
          done
          test -s /tmp/catalog.json || { cat /tmp/server.log; exit 1; }
      - name: Download offline database
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 https://raw.githubusercontent.com/arda-/anime-character-offline-database/prod/latest/characters.min.json.gz -o /tmp/characters.json.gz
          gzip -dc /tmp/characters.json.gz > /tmp/characters.json
      - name: Fill every missing visual
        run: node scripts/phase4-complete-coverage.mjs
      - name: Verify exact 100 percent coverage
        run: |
          node -e "const r=require('./PHASE4_IMAGE_REPORT.json'); console.log('TOTAL',r.total,'CANONICAL',r.canonical,'MISSING',r.missing,'COVERAGE',r.coverage); if(r.missing!==0||r.coverage!==100)process.exit(1)"
          node --check server.js
      - name: Commit and push safely
        run: |
          set -euo pipefail
          kill $(cat /tmp/server.pid) 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/char-images PHASE4_IMAGE_REPORT.json
          git commit -m "fix: complete exact 100 percent image coverage" || true
          git pull --rebase origin image-coverage-100-v1
          git push origin HEAD:image-coverage-100-v1
      - uses: actions/upload-artifact@v4
        with:
          name: phase4b-image-report
          path: |
            PHASE4_IMAGE_REPORT.json
            /tmp/server.log
