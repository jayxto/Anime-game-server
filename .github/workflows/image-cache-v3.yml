name: Cache anime character images

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Redownload even when some cached files already exist'
        required: false
        default: 'true'
      deep:
        description: 'Use deep search mode'
        required: false
        default: 'true'
  push:
    paths:
      - 'scripts/cache-character-images.mjs'
      - '.github/workflows/**image-cache*.yml'
      - 'char-images.json'
      - 'qap-themes.json'
      - 'tierlist-themes.json'

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image converter
        run: npm install sharp

      - name: Download, repair and convert images
        env:
          IMAGE_CACHE_REFRESH: ${{ inputs.refresh == 'true' && '1' || '0' }}
          IMAGE_CACHE_DEEP: ${{ inputs.deep == 'false' && '0' || '1' }}
          IMAGE_CACHE_CONCURRENCY: '6'
          IMAGE_CACHE_SIZE: '384'
          IMAGE_CACHE_QUALITY: '80'
        run: node scripts/cache-character-images.mjs --deep

      - name: Commit generated image cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh image cache"
          git push
