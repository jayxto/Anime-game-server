name: Record Anime Game complete content
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/record-final-game.yml'
      - 'promo/record-final.js'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - run: timeout 380s node promo/record-final.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-full-feature-showcase
          path: promo/final-showcase-output/
          if-no-files-found: warn
