name: Record full Anime Game streamer showcase
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/record-anime-showcase.yml'
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - name: Record all accessible gameplay screens
        run: timeout 420s node promo/record-showcase.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-streamer-complete
          path: promo/showcase-output/
          if-no-files-found: warn
