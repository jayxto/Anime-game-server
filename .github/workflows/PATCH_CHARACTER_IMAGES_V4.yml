name: Patch verified character images V4

on:
  push:
    branches: [image-fix-v4]
    paths:
      - '.github/workflows/PATCH_CHARACTER_IMAGES_V4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-fix-v4
          fetch-depth: 0
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed V4 image patch
        run: python3 .github/patch_character_images_v4.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify V4 anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_NON_CHARACTER_EXACT_V1' server.js
          grep -q 'SIMPLE_CHARACTER_ALIASES_V4' server.js
          grep -q 'SIMPLE_VERIFIED_CHARACTER_IMAGES_V4' server.js
          grep -q "drstone|senku ishigami" server.js
          grep -q "dragonball|docteur arinsu" server.js
          grep -q "conan|kaito kid" server.js
          grep -q "bocchi|futari gotoh" server.js
      - name: Verify exact non-character exclusions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          expected=[
            'eightysix|federacy','assclass|final exams','assclass|graduation',
            'beastars|interspecies relations','beastars|murder incident solution',
            'clover|charlotte s squad','clover|fuegoleon s squad',
            'codegeass|r2 final rebellion','conan|black organization',
            'conan|clash of red and black','conan|scarlet return',
            'drstone|new america city','drstone|stone wars','drstone|stone world','drstone|treasure island'
          ]
          missing=[x for x in expected if repr(x) not in s]
          if missing: raise SystemExit('missing exclusions: '+repr(missing))
          print('all exact exclusions present:',len(expected))
          PY
      - name: Commit tested V4 patch on branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_character_images_v4.py .github/workflows/PATCH_CHARACTER_IMAGES_V4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: verified character images batch 4 [skip ci]"
          git push origin HEAD:image-fix-v4
