name: Patch theme character images v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_THEME_CHAR_IMAGES_V9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply strict theme portrait filter
        run: python3 .github/patch_theme_char_images_v9.py
      - name: Verify syntax and anchors
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -q 'THEME_CHAR_IMAGES_QAP_FILTER_V9' server.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          a=s.find('const THEME_CHAR_IMAGES')
          b=s.find('function staticCharImage',a)
          block=s[a:b]
          assert "const u = resolveImageUniverseKey(item.sub);" not in block
          assert "nonCharacterThemeIds" in block
          assert "item.media" in block
          print('theme portrait filter verified')
          PY
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_theme_char_images_v9.py .github/workflows/PATCH_THEME_CHAR_IMAGES_V9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep theme image cache character-only [skip ci]"
          git push origin HEAD:main
