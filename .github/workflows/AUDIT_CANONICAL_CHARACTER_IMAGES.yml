name: Audit canonical character image paths
on:
  push:
    paths:
      - '.github/workflows/AUDIT_CANONICAL_CHARACTER_IMAGES.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract avatar and image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          for needle in ["avatar", "resolveCharacterImage(", "staticCharImage(", "character-image-file"]:
              print('\n===== '+needle+' =====')
              pos=0;n=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  n+=1
                  print('\n--- %d @ %d ---' % (n,i))
                  print(s[max(0,i-1500):min(len(s),i+3500)])
                  pos=i+len(needle)
                  if n>=25: break
          PY
