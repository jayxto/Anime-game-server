name: Patch verified character images V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_VERIFIED_CHARACTER_IMAGES_V1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add reviewed character sources
        run: python3 .github/patch_verified_character_images_v1.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify source anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_VERIFIED_CHARACTER_IMAGES_V1' server.js
          grep -q 'character_sub1_main.jpg' server.js
          grep -q 'character/sawyer/04.jpg' server.js
          grep -q 'simpleVerifiedCharacterImage(x.u,x.name)' server.js
      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_verified_character_images_v1.py .github/workflows/PATCH_VERIFIED_CHARACTER_IMAGES_V1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add visually verified character image batch 1 [skip ci]'
          git push origin HEAD:main
