name: Fetch full migration failed

on:
  push:
    branches: [image-audit-work]
    paths:
      - '.github/workflows/FETCH_FULL_MIGRATION_FAILED.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Fetch full migration failures
        run: python3 .github/fetch_full_migration_failed.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/full_migration_failed.json .github/full_migration_failed.txt
          git commit -m 'audit: record full migration failures [skip ci]'
          git push origin HEAD:image-audit-work
