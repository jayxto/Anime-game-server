name: Patch verified transformation images V2 batch 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_IMAGES_V2_BATCH4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add fourth verified image batch
        run: python3 .github/patch_transform_images_v2_batch4.py

      - name: Verify server syntax
        run: node --check server.js

      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH4' server.js
          grep -q 'digimon/wargreymon.jpg' server.js
          grep -q 'digimon/metalgarurumon.jpg' server.js
          grep -q 'digimon/omegamon.jpg' server.js
          grep -q 'd61182f292445425a90ab2d954a08b0d.jpg' server.js
          grep -q 'Allen.Walker.full.278757.jpg' server.js

      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_images_v2_batch4.py .github/workflows/PATCH_TRANSFORM_IMAGES_V2_BATCH4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 4 [skip ci]"
          git push origin HEAD:main
