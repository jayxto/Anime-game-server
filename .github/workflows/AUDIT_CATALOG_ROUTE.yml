name: Audit character catalog route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_CATALOG_ROUTE.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Extract catalogue route
        run: python3 .github/extract_catalog_route.py
      - name: Commit route context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/catalog_route_context.txt
          git commit -m "chore: extract character catalog route [skip ci]"
          git push origin HEAD:main
