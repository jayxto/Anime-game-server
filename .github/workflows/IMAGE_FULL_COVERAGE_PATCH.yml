name: Image full coverage patch

on:
  push:
    paths:
      - '.github/workflows/IMAGE_FULL_COVERAGE_PATCH.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server image coverage
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQoKcD1QYXRoKCdzZXJ2ZXIuanMnKQpzPXAucmVhZF90ZXh0KGVuY29kaW5nPSd1dGYtOCcpCm9yaWdpbmFsPXMKCiMgUmVwbGFjZSBzaW1wbGVDYXRhbG9ndWUoKSB3aXRoIGEgY29tcGxldGUgY2F0YWxvZ3VlIGJ1aWxkZXIuCnN0YXJ0PXM...TRUNCATED...' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: node --check server.js

      - name: Static coverage assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          required=[
            'IMAGE FULL COVERAGE V2',
            "typeof cardPool === 'function'",
            'cardAllSpecials(u)',
            "cards-halloween",
            'DLE_MASTER_NAMES',
            'RG_POOLS_V2',
            'PM_POWER_OVERRIDES',
            'image_bytes BYTEA',
            "/api/character-image-file",
            "for (let page=1; page<=8; page++)"
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('Static coverage assertions OK')
          PY

      - name: Smoke test server and catalogue
        run: |
          set -e
          PORT=18080 DATABASE_URL='' node server.js > /tmp/anime-game-smoke.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:18080/api/character-catalog -o /tmp/catalog.json; then OK=1; break; fi
            sleep 1
          done
          if [ "$OK" != "1" ]; then
            cat /tmp/anime-game-smoke.log
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/catalog.json'))
          chars=d.get('characters') or []
          card=[x for x in chars if 'cards' in (x.get('sources') or []) or 'cards-special' in (x.get('sources') or [])]
          assert d.get('ok') is True, d
          assert len(chars) >= 100, len(chars)
          assert len(card) >= 50, len(card)
          report=(
            'Catalogue smoke test OK\n'
            f'Total unique characters: {len(chars)}\n'
            f'Characters explicitly coming from card pools: {len(card)}\n'
            f'Anime groups: {len(d.get("animes") or [])}\n'
          )
          print(report)
          open('IMAGE_COVERAGE_PATCH_REPORT.txt','w').write(report)
          PY
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          tail -n 40 /tmp/anime-game-smoke.log || true

      - name: Package final server artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-game-server-full-images
          path: |
            server.js
            IMAGE_COVERAGE_PATCH_REPORT.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean temporary files and commit final branch
        run: |
          set -e
          rm -rf .github
          rm -f IMAGE_AUDIT.txt IMAGE_CORE_SNIPPETS.txt IMAGE_TARGET_SNIPPETS.txt IMAGE_COVERAGE_PATCH_REPORT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: full image coverage for every character and card"
          git push origin HEAD:image-full-coverage-work
