name: Audit live image health now

on:
  push:
    branches: [image-audit-work]
    paths:
      - '.github/workflows/AUDIT_LIVE_IMAGE_HEALTH_NOW.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Fetch deployed health
        shell: bash
        run: |
          set -euo pipefail
          url='https://anime-game-server.onrender.com/api/character-image-health'
          for i in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 60 -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$url" || true)
            if [ "$code" = '200' ] && python3 - <<'PY'
import json,sys
try:
    d=json.load(open('/tmp/health.json',encoding='utf-8'))
    sys.exit(0 if d.get('ok') is True else 1)
except Exception:
    sys.exit(1)
PY
            then break; fi
            sleep 10
          done
          cp /tmp/health.json .github/live_image_health_now.json
          python3 - <<'PY'
import json
p='.github/live_image_health_now.json'
d=json.load(open(p,encoding='utf-8'))
t=d.get('totals') or {}; s=d.get('state') or {}
lines=[
  f"DB rows={t.get('rows',0)} bytes={t.get('with_bytes',0)} db_missing={d.get('missingCount',0)} manual={t.get('manual',0)}",
  f"Catalogue total={d.get('catalogueTotal','n/a')} stored={d.get('catalogueStored','n/a')} missing={d.get('catalogueMissingCount','n/a')}",
  f"Migration running={s.get('running')} done={s.get('done')} pass={s.get('pass')} total={s.get('total')} stored={s.get('stored')} missing={s.get('missing')}",
  '', '=== CATALOGUE MISSING ==='
]
for x in d.get('catalogueMissing') or []:
    lines.append(f"{x.get('u','')} | {x.get('name','')} | {x.get('anime','')} | sources={','.join(x.get('sources') or [])}")
lines += ['', '=== DB MISSING BYTES ===']
for x in d.get('missing') or []:
    lines.append(f"{x.get('u','')} | {x.get('name','')} | status={x.get('status','')}")
open('.github/live_image_health_now.txt','w',encoding='utf-8').write('\n'.join(lines))
PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/live_image_health_now.json .github/live_image_health_now.txt
          git commit -m 'audit: record current live image health [skip ci]'
          git push origin HEAD:image-audit-work
