name: Audit false character sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_FALSE_CHARACTER_SOURCES.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Trace false character sources
        run: python3 .github/audit_false_character_sources.py
      - name: Commit trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/false_character_sources.txt
          git commit -m 'audit: trace false character sources [skip ci]'
          git push origin HEAD:main
