name: Ultra simple repo + persistent character images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ULTRA_SIMPLE_REPO.yml'

permissions:
  contents: write

concurrency:
  group: ultra-simple-repo-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build one-time migration script
        shell: bash
        run: |
          mkdir -p scripts
          python - <<'PY2'
          import base64,gzip,pathlib
          data = base64.b64decode("")
          pathlib.Path('scripts/ultra-simple-migrate.mjs').write_bytes(gzip.decompress(data))
          PY2
          node --check scripts/ultra-simple-migrate.mjs

      - name: Phase 1 - add PostgreSQL image store and migration
        run: |
          node scripts/ultra-simple-migrate.mjs phase1
          node --check server.js

      - name: Commit phase 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "refactor: migrate all character images into PostgreSQL"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Wait for Render to copy every character image into PostgreSQL
        run: |
          node <<'NODE'
          const url='https://anime-game-server.onrender.com/api/image-migration-status';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last=null;
          for(let i=0;i<150;i++){
            try{
              const r=await fetch(url,{cache:'no-store',headers:{accept:'application/json'}});
              if(r.ok){
                const d=await r.json(); last=d;
                console.log(new Date().toISOString(), JSON.stringify(d));
                if(d.done && Number(d.total)>0 && Number(d.missing)===0){
                  console.log('All character images are persistent in PostgreSQL.');
                  process.exit(0);
                }
                if(!d.running && d.finishedAt && Number(d.missing)>0){
                  throw new Error('Migration finished with '+d.missing+' unresolved images: '+JSON.stringify(d.failed||[]));
                }
                if(!d.running && d.lastError){
                  throw new Error('Migration error: '+d.lastError);
                }
              } else console.log('Render not updated yet: HTTP',r.status);
            }catch(e){
              if(String(e.message||e).startsWith('Migration finished') || String(e.message||e).startsWith('Migration error')) throw e;
              console.log('Waiting for Render:',e.message||e);
            }
            await sleep(24000);
          }
          throw new Error('Timed out waiting for image migration. Last status: '+JSON.stringify(last));
          NODE

      - name: Phase 2 - inline UI/data and delete every obsolete folder
        run: |
          node scripts/ultra-simple-migrate.mjs phase2
          node --check server.js
          test -s index.html
          test -s server.js
          test -s package.json
          test -s package-lock.json
          test -d music
          test ! -e assets
          test ! -e locales
          test ! -e char-images.json
          test ! -e qap-themes.json
          test ! -e tierlist-themes.json
          test ! -e node_modules

      - name: Commit final ultra-simple repository
        run: |
          git add -A
          git commit -m "refactor: ultra-simple repo with DB-backed character images"
          git pull --rebase origin main
          git push origin HEAD:main
