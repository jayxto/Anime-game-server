name: Patch verified transformation batch 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source images are reachable
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cdn.cgmagonline.com/wp-content/uploads/2025/08/chainsaw-manthe-movie-reze-arc-coming-out-october-29-in-north-america-2025-08-30-740203-1536x864.jpg'
            'https://pbs.twimg.com/media/G6SDDOeXcAA_cIr.jpg'
            'https://i.pinimg.com/736x/5e/96/e9/5e96e95cf353880d43166d6f5e22db35.jpg'
            'https://pbs.twimg.com/media/EaE24AnU4AAvwLR.jpg'
            'https://i.pinimg.com/originals/e3/d3/b9/e3d3b9112905d439904bd640c7936161.jpg'
            'https://forum.evanotend.com/uploads/monthly_2018_06/Eva2-22_C1756.jpg.d3a17260b9130e49674577dbfa505ee5.jpg'
            'https://i.pinimg.com/736x/95/00/ac/9500ac0a6049f35f0723bbc20c8c64a8.jpg'
            'https://vignette.wikia.nocookie.net/souleater/images/5/5b/Episode_50_-_Asura_recreated_third_form.png/revision/latest?cb=20191007130646'
            'https://vignette.wikia.nocookie.net/inuyasha/images/a/ad/The_Demon%27s_True_Nature.png/revision/latest?cb=20190215234638'
            'https://m.media-amazon.com/images/M/MV5BNjcwMzM3YzQtNzFiZS00YzVlLWFlOGMtYTllM2VjOTNjYTZmXkEyXkFqcGc%40._V1_.jpg'
            'https://i.imgur.com/vsXb2KG.png'
            'https://occ-0-8407-2219.1.nflxso.net/dnm/api/v6/6AYY37jfdO6hpXcMjf9Yu5cnmO0/AAAABVN6dDaO-MpX2Qdneytzsxs77uzLmR3Yo-H9d98Xidi3AgAFwmBsOwXyV2-o5sPh9SkQlI-e5y5Sg_KMnDoW7EUqcb4vI14AFWc4.jpg?r=168'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl -L --fail --silent --show-error --max-time 20 -A 'Mozilla/5.0' -o /dev/null "$url"
          done
      - name: Apply batch 7
        run: python3 .github/patch_transform_batch7.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH7' server.js
          grep -q "needs:\['denji','chainsaw devil'\]" server.js
          grep -q "needs:\['pochita','hero of hell'\]" server.js
          grep -q "needs:\['garou','awakened'\]" server.js
          grep -q "needs:\['kaneki','kakuja'\]" server.js
          grep -q "needs:\['alucard','level zero'\]" server.js
          grep -q "needs:\['ainz','perfect warrior'\]" server.js
          grep -q "needs:\['sakura','dark sakura'\]" server.js
      - name: Refresh transformation audit
        run: python3 .github/audit_transform_remaining_v3.py
      - name: Commit verified batch and audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch7.py .github/workflows/PATCH_TRANSFORM_BATCH7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 7 [skip ci]"
          git push origin HEAD:main
