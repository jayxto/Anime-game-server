name: Patch verified transformation batch 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch 7
        run: python3 .github/patch_transform_batch7.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH7' server.js
          grep -q 'Frieren-reveals-her-true-power.jpg' server.js
          grep -q 'Ex9rFYjU8AIClSJ.jpg' server.js
          grep -q 'Ordinal.Strata.full.2342777.jpg' server.js
      - name: Commit batch 7
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch7.py .github/workflows/PATCH_TRANSFORM_BATCH7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 7 [skip ci]"
          git push origin HEAD:main
