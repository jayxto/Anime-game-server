name: Wait final image migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/WAIT_IMAGE_MIGRATION_FINAL.yml'

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Wait for migration final state
        run: python3 .github/wait_image_migration_final.py
      - name: Commit final unresolved report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/final_image_migration_report.json .github/final_image_migration_report.txt
          if git diff --cached --quiet; then
            echo "No migration report changes"
            exit 0
          fi
          git commit -m "chore: capture final unresolved image migration [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
