name: Patch transformation batch 5 V3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH5_V31.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and self-validate strict fallback order plus batch 5
        run: python3 .github/patch_transform_batch5_v31.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch5_v31.py .github/workflows/PATCH_TRANSFORM_BATCH5_V31.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation batch 5 and strict fallback order [skip ci]"
          git push origin HEAD:main
