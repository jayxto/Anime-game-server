name: Patch full missing image audit endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_MISSING_IMAGE_AUDIT_ENDPOINT.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add full missing image audit endpoint
        run: python3 .github/patch_missing_image_audit_endpoint.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AG_FULL_MISSING_IMAGE_AUDIT_V1' server.js
          grep -q "/api/character-image-missing-list" server.js
          grep -q 'slice(0,1500)' server.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_missing_image_audit_endpoint.py .github/workflows/PATCH_MISSING_IMAGE_AUDIT_ENDPOINT.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: expose full missing character image audit [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
