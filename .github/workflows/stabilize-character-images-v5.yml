name: Stabilize every character image v7

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stabilize-character-images-v5.mjs'
      - '.github/workflows/stabilize-character-images-v5.yml'

permissions:
  contents: write

concurrency:
  group: stabilize-character-images-v5
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITE_URL: https://anime-game-server.onrender.com
      IMAGE_WORKERS: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image encoder
        run: npm install --no-save --package-lock=false sharp@0.33.5
      - name: Check stabilizer syntax
        run: node --check scripts/stabilize-character-images-v5.mjs
      - name: Download, repair and localize every catalogue image
        run: node scripts/stabilize-character-images-v5.mjs
      - name: Validate outputs
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('character-image-manifest.json','utf8')); if(!m.total||m.missingFiles) throw new Error('image validation failed'); JSON.parse(fs.readFileSync('char-images.json','utf8')); console.log('JSON/images OK',m.total)"
          test -s CHARACTER_IMAGE_STABLE_REPORT.md
      - name: Commit permanent local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add char-images.json character-image-manifest.json CHARACTER_IMAGE_STABLE_REPORT.md assets/images/chars
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: persist and verify every character image locally"
          git pull --rebase origin main
          git push origin HEAD:main
