name: Probe live status

on:
  push:
    branches: [image-audit-work]
    paths:
      - '.github/workflows/PROBE_LIVE_STATUS.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Probe deployed service
        run: python3 .github/probe_live_status.py
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/live_status_probe.txt
          git commit -m 'audit: record live service status [skip ci]'
          git push origin HEAD:image-audit-work
