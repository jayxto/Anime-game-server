name: Live DB missing images branch

on:
  push:
    branches: [live-audit-v8]
    paths:
      - '.github/workflows/LIVE_DB_MISSING_BRANCH.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-audit-v8
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Fetch exact missing image rows
        run: python3 .github/fetch_full_missing_image_list.py
      - name: Commit branch-only DB snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/full_missing_image_list.json .github/full_missing_image_list.txt
          git commit -m "audit: snapshot exact DB missing images [skip ci]"
          git pull --rebase origin live-audit-v8
          git push origin HEAD:live-audit-v8
