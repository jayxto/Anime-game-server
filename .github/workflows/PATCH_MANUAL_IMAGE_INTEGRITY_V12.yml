name: Patch manual image integrity v12
on:
  push:
    paths:
      - '.github/workflows/PATCH_MANUAL_IMAGE_INTEGRITY_V12.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decode patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_manual_image_integrity_v12.py
      - name: Apply patch
        run: python /tmp/patch_manual_image_integrity_v12.py
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Verify server syntax and invariants
        run: |
          node --check server.js
          python - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          checks={
            'canonical v11 kept':'AG_CANONICAL_CHARACTER_IMAGE_V11' in s,
            'integrity marker':'AG_MANUAL_IMAGE_INTEGRITY_V12' in s,
            'sharp import':"require('sharp')" in s or 'require("sharp")' in s,
            'manual normalize':"if (status === 'manual-admin')" in s and "simpleNormalizeImage(image)" in s,
            'startup repair':'await simpleRepairManualImageRows();' in s,
            'route self heal':"X-AG-Image-Integrity','v12'" in s,
            'no immutable unversioned':"req.query.v ? 'public,max-age=31536000,immutable' : 'no-cache,max-age=0,must-revalidate'" in s,
            'save checks decode':'const storedOk=await simpleStoreImage' in s,
          }
          for name,ok in checks.items():
              print(name,ok)
              if not ok: raise SystemExit('FAILED: '+name)
          PY
      - name: Test real decode and fake-byte rejection
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm'), assert=require('assert'), sharp=require('sharp');
          const s=fs.readFileSync('server.js','utf8');
          const a=s.indexOf('function simpleImageLooksValid');
          const b=s.indexOf('function simpleImageIsPrivateHost',a);
          assert(a>=0 && b>a);
          const ctx={Buffer,sharp};
          vm.createContext(ctx);
          vm.runInContext(s.slice(a,b),ctx);
          (async()=>{
            const png=await sharp({create:{width:64,height:64,channels:4,background:{r:255,g:0,b:0,alpha:1}}}).png().toBuffer();
            const normalized=await ctx.simpleNormalizeImage({bytes:png,mime:'image/png'});
            assert(normalized && normalized.mime==='image/webp');
            const meta=await sharp(normalized.bytes).metadata();
            assert(meta.format==='webp' && meta.width===64 && meta.height===64);
            const fake=Buffer.alloc(1200,65);
            assert.strictEqual(await ctx.simpleNormalizeImage({bytes:fake,mime:'image/jpeg'}),null);
            console.log('manual image integrity decode tests OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run transformation regression tests
        run: |
          if [ -f .github/transform-audit.test.cjs ]; then node .github/transform-audit.test.cjs; fi
      - name: Commit tested integrity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/AUDIT_CANONICAL_IMAGE_PERSISTENCE.yml
          rm -f .github/workflows/PATCH_MANUAL_IMAGE_INTEGRITY_V12.yml
          git add server.js .github/workflows
          git commit -m "fix: normalize and self-heal manual character images [skip ci]"
          git push origin HEAD:main
