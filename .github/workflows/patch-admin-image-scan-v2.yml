name: Patch admin image scan v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-admin-image-scan-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make admin detect every character image automatically
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("assets/js/ui-refactor.js")
          s = p.read_text(encoding="utf-8")

          marker = "/* Admin character viewer v1 */"
          if marker not in s:
              raise SystemExit("Admin character viewer v1 not found")

          if "Automatic full image scan v2" in s:
              print("Patch already installed")
              raise SystemExit(0)

          start = s.index(marker)
          apply_pos = s.find("    function apply() {", start)
          if apply_pos < 0:
              raise SystemExit("apply() not found after admin viewer")

          helper = r'''
    /* Automatic full image scan v2
       Vérifie TOUT le catalogue dès son ouverture, même les cartes non affichées.
       Les cartes restent paginées pour ne pas bloquer l'iPhone. */
    let fullScanRunning = false;
    let fullScanDone = 0;
    let fullScanOk = 0;
    let fullScanBad = 0;

    function fullScanStats(final = false) {
        const st = document.getElementById('ag-charadmin-stats');
        if (!st) return;
        if (final) {
            st.textContent = `✅ Vérification terminée : ${fullScanDone}/${state.all.length} • images OK ${fullScanOk} • cassées ${fullScanBad}`;
        } else {
            st.textContent = `🔎 Vérification automatique : ${fullScanDone}/${state.all.length} • ✅ ${fullScanOk} • ❌ ${fullScanBad}`;
        }
    }

    function probeCharacterImage(x) {
        return new Promise(resolve => {
            const k = keyOf(x);
            const already = state.status.get(k);
            if (already === 'ok' || already === 'bad') {
                fullScanDone++;
                if (already === 'ok') fullScanOk++; else fullScanBad++;
                return resolve();
            }

            const url = x.img || x.originalImg || '';
            if (!url) {
                state.status.set(k, 'bad');
                fullScanDone++;
                fullScanBad++;
                return resolve();
            }

            const img = new Image();
            let settled = false;
            const finish = status => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                state.status.set(k, status);
                fullScanDone++;
                if (status === 'ok') fullScanOk++; else fullScanBad++;
                resolve();
            };
            img.onload = () => finish('ok');
            img.onerror = () => finish('bad');
            const timer = setTimeout(() => finish('bad'), 12000);
            img.src = url;
        });
    }

    async function detectAllCharacterImages() {
        if (fullScanRunning || !state.loaded || !state.all.length) return;
        fullScanRunning = true;
        fullScanDone = 0;
        fullScanOk = 0;
        fullScanBad = 0;
        fullScanStats(false);

        let cursor = 0;
        let refreshAt = 0;
        const workerCount = Math.min(24, Math.max(1, state.all.length));

        async function worker() {
            while (cursor < state.all.length) {
                const i = cursor++;
                await probeCharacterImage(state.all[i]);

                // Rafraîchit les badges visibles sans recréer toute la grille à chaque image.
                if (fullScanDone - refreshAt >= 40 || fullScanDone === state.all.length) {
                    refreshAt = fullScanDone;
                    fullScanStats(false);
                    const cards = document.querySelectorAll('.ag-charcard[data-key]');
                    cards.forEach(card => {
                        const status = state.status.get(card.dataset.key);
                        if (!status) return;
                        card.classList.remove('ok', 'bad');
                        card.classList.add(status);
                        const badge = card.querySelector('.ag-charstate');
                        if (badge) badge.textContent = status === 'ok' ? 'OK' : 'CASSÉE';
                    });
                }
            }
        }

        await Promise.all(Array.from({ length: workerCount }, worker));
        fullScanRunning = false;
        fullScanStats(true);

        // Si l'admin filtre sur OK/CASSÉE, recharge la liste une fois le scan complet.
        const statusSel = document.getElementById('ag-charadmin-status');
        if (statusSel && statusSel.value) apply();
    }

'''
          s = s[:apply_pos] + helper + s[apply_pos:]

          # Lance automatiquement le scan juste après le chargement du catalogue.
          load_anchor = "            apply();\n        } catch (e) {"
          load_pos = s.find(load_anchor, start)
          if load_pos < 0:
              raise SystemExit("load() anchor not found")
          s = s[:load_pos] + s[load_pos:].replace(
              load_anchor,
              "            apply();\n            detectAllCharacterImages();\n        } catch (e) {",
              1
          )

          # Texte d'aide plus clair.
          old = "Catalogue commun des modes. Les images sont chargées par lien, sans téléchargement local obligatoire."
          new = "Catalogue commun des modes. Toutes les images sont vérifiées automatiquement dès l’ouverture, sans devoir taper le nom des personnages."
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("Admin automatic full image scan v2 installed")
          PY

      - name: Check JavaScript syntax
        run: node --check assets/js/ui-refactor.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ui-refactor.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: scan all character images automatically in admin"
          git push
