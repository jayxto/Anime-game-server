name: Audit character image universe aliases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_CHARACTER_MISSING_ALIASES.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Analyze missing image aliases
        run: python3 .github/analyze_character_missing_aliases.py
      - name: Commit alias report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/character_missing_aliases.txt
          git commit -m "chore: audit character image universe aliases [skip ci]"
          git push origin HEAD:main
