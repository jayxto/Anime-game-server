name: Patch admin character URL persistence v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_ADMIN_CHARACTER_URL_PERSISTENCE_V7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            .github
          sparse-checkout-cone-mode: false
      - name: Patch admin character URL option
        run: python3 .github/patch_admin_character_url_persistence_v7.py
      - name: Verify persistent admin URL wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AG_CHARACTER_ADMIN_PERSISTENT_URL_V7' index.html
          grep -q "row.sourceUrl=savedSource" index.html
          grep -q "row.manualOverride=true" index.html
          grep -q "row.img=savedImage" index.html
          grep -q "/api/admin/character-catalog-persistent" index.html
          grep -q "/api/admin/character-image" index.html
          git diff --check
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_admin_character_url_persistence_v7.py .github/workflows/PATCH_ADMIN_CHARACTER_URL_PERSISTENCE_V7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make admin character URL option truly persistent [skip ci]"
          git push origin HEAD:main
