name: Patch corrected transformation batch 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH5_FIX.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply missing 12-row batch
        run: python3 .github/patch_transform_batch5_fix.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify corrected batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH5_FIX_12' server.js
          grep -q "needs:\['ichigo','vasto lorde'\]" server.js
          grep -q "needs:\['gon','adult gon'\]" server.js
          grep -q "needs:\['eren','founding titan'\]" server.js
          grep -q "needs:\['natsu','dragon force'\]" server.js
          grep -q "needs:\['izuku','dark deku'\]" server.js
          grep -q "needs:\['escanor','the one ultimate'\]" server.js
      - name: Commit corrected batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch5_fix.py .github/workflows/PATCH_TRANSFORM_BATCH5_FIX.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: apply skipped 12-row transformation batch [skip ci]"
          git push origin HEAD:main
