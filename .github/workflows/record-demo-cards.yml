name: Record Anime Game card content with demo account
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/record-demo-cards.yml'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - run: timeout 180s node promo/record-demo-cards.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-demo-cards
          path: promo/demo-cards-output/
          if-no-files-found: warn
