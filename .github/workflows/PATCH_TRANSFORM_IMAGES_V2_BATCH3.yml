name: Patch verified transformation images V2 batch 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_IMAGES_V2_BATCH3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add third verified image batch
        run: python3 .github/patch_transform_images_v2_batch3.py

      - name: Verify server syntax
        run: node --check server.js

      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH3' server.js
          grep -q '8wzhJiyppt1phCJs%2F003.jpg' server.js
          grep -q '9fbc6f2e56efa93c3a23cb7b54b5c62d.jpg' server.js
          grep -q 'luffy_gear_4_fourth_boundman.jpg' server.js

      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_images_v2_batch3.py .github/workflows/PATCH_TRANSFORM_IMAGES_V2_BATCH3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 3 [skip ci]"
          git push origin HEAD:main
