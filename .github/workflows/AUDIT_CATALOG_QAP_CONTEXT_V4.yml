name: Audit character catalog QAP context v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_CATALOG_QAP_CONTEXT_V4.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Extract QAP catalogue contexts
        run: python3 .github/audit_catalog_qap_context_v4.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/catalog_qap_context_v4.txt
          git commit -m "chore: write character catalog qap context v4 [skip ci]"
          git push origin HEAD:main
