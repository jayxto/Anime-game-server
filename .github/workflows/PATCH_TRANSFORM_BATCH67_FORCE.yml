name: Force verified transformation batches 6 and 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH67_FORCE.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Force missing verified rows
        run: python3 .github/patch_transform_batch67_force.py
      - name: Verify syntax and actual rows
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -Fq 'Colossal_Titan_%28Anime%29_character_image_%28Armin_Arlelt%29' server.js
          grep -Fq 'Tensura-Rimuru-Demon-Lord.jpg' server.js
          grep -Fq 'dandadan-okarun-turbo-granny-form-s2' server.js
          grep -Fq 'Frieren-reveals-her-true-power.jpg' server.js
          grep -Fq 'Ordinal.Strata.full.2342777.jpg' server.js
          git diff --exit-code --quiet -- server.js && { echo 'server.js unchanged unexpectedly'; exit 1; } || true
      - name: Commit forced rows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch67_force.py .github/workflows/PATCH_TRANSFORM_BATCH67_FORCE.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: actually persist verified transformation batches 6 and 7 [skip ci]"
          git push origin HEAD:main
