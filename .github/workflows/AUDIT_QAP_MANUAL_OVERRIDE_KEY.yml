name: Audit QAP manual override key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_QAP_MANUAL_OVERRIDE_KEY.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify QAP runtime reads manual override with source and item name
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const source=fs.readFileSync('server.js','utf8');
          const start=source.indexOf("app.get('/api/arcade/item-image',");
          const end=source.indexOf('\n});', start)+4;
          assert.ok(start>=0 && end>start, 'item-image route not found');
          let handler, response, lookupArgs=null;
          const it={name:'QAP Override Probe',char:'Probe',sub:'Probe • Naruto',img:'https://example.com/embedded.png'};
          const context=vm.createContext({
            app:{get:(_path,fn)=>{handler=fn;}},
            QAP_ITEM_IMAGE_CACHE:new Map(),
            arcItemsFor:()=>[it],
            normalizeImageKey:value=>String(value||'').toLowerCase(),
            FANDOM_UNIVERSE_ALIASES:{naruto:'naruto'},
            FANDOM_WIKIS:{naruto:'example.com'},
            getCachedCharacterImage:async(...args)=>{lookupArgs=args;return {imageUrl:'/api/image/manual-override'};},
            qapVerifiedTransformSource:()=>null,
            persistQapTransformImage:async()=>null,
            fetchFandomTransformationImage:async()=>null,
            qapAniListCharacterImage:async()=>null,
            console
          });
          vm.runInContext(source.slice(start,end),context);
          assert.equal(typeof handler,'function');
          (async()=>{
            await handler({query:{source:'qt:rival',name:it.name}}, {set:()=>{},json:v=>{response=JSON.parse(JSON.stringify(v));}});
            console.log('LOOKUP_ARGS='+JSON.stringify(lookupArgs));
            console.log('RESPONSE='+JSON.stringify(response));
            assert.deepEqual(lookupArgs,['qt:rival',it.name]);
            assert.equal(response?.ok,true);
            assert.equal(response?.imageUrl,'/api/image/manual-override');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
