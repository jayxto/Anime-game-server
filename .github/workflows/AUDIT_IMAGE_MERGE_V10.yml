name: Audit image merge v10
on:
  push:
    paths:
      - '.github/workflows/AUDIT_IMAGE_MERGE_V10.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print catalogue image helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['mergeCatalogue','instantStatus','imageOf','x.imgs?.length > 1']:
              print('\n===== '+needle+' =====')
              starts=[]
              pos=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  starts.append(i)
                  pos=i+len(needle)
              print('occurrences',starts[:10])
              for i in starts[:4]:
                  print('\n---',i,'---')
                  print(s[max(0,i-2200):min(len(s),i+5200)])
          PY
