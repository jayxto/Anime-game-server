name: Patch verified transformation batch 8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source images are reachable
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://movieplayer.net-cdn.it/t/images/2025/10/06/mha_armored_all_might_jpg_1400x0_crop_q85.jpg'
            'https://image.idntimes.com/post/20221230/untitled-3ccf01ac1753009258072284ab853f9b.png'
            'https://scrmbl.imgix.net/posts-images/2026/01/my-hero-academia-chapter-265-01.jpg'
            'https://corp.toei-anim.co.jp/en/index/firm-slide2/slide1/image/sme_1126.jpg'
            'https://animeanime.jp/imgs/p/JsfylNXtaHqOdo8c8P_mHjahJ65Jrq_oqaqr/711253.jpg'
            'https://shopyugioh.com/cdn/shop/files/Yami_Yugi_YGO.png?v=1728459644&width=700'
            'https://66.media.tumblr.com/0079638e6e2c7fb1f3d92682d4a167f2/tumblr_inline_ozekdzBmGh1rbthts_540.png'
            'https://www.navitoworld.com/cdn/shop/products/Ryuko_Matoi_Senketsu_Kisaragi_Ver._GSC_00.jpg?v=1429113293'
            'https://thetv.jp/i/nw/1303692/15566033.jpg?w=1284'
            'https://static.zerochan.net/Bondrewd.full.3725399.jpg'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl -L --fail --silent --show-error --max-time 20 -A 'Mozilla/5.0' -o /dev/null "$url"
          done
      - name: Apply batch 8
        run: python3 .github/patch_transform_batch8.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH8' server.js
          grep -q "needs:\['all might','armored all might'\]" server.js
          grep -q "needs:\['aki','gun fiend'\]" server.js
          grep -q "needs:\['tokoyami','dark shadow','ragnarok'\]" server.js
          grep -q "needs:\['usagi','sailor moon eternal'\]" server.js
          grep -q "needs:\['usagi','super sailor moon'\]" server.js
          grep -q "needs:\['yugi','yami yugi'\]" server.js
          grep -q "needs:\['kaneki','dragon kaneki'\]" server.js
          grep -q "needs:\['ryuko','senketsu kisaragi'\]" server.js
          grep -q "needs:\['shigaraki','awakened'\]" server.js
          grep -q "needs:\['bondrewd','white whistle'\]" server.js
      - name: Refresh transformation audit
        run: python3 .github/audit_transform_remaining_v3.py
      - name: Commit verified batch and audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch8.py .github/workflows/PATCH_TRANSFORM_BATCH8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 8 [skip ci]"
          git push origin HEAD:main
