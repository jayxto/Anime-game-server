name: Patch manual image lock v9
on:
  push:
    paths:
      - '.github/patch_manual_image_lock_v9.py'
      - '.github/workflows/PATCH_MANUAL_IMAGE_LOCK_V9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/patch_manual_image_lock_v9.py
      - name: Verify syntax and behavior markers
        run: |
          node --check server.js
          python - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text(encoding='utf-8')
          s=Path('server.js').read_text(encoding='utf-8')
          checks={
            'index marker':'AG_MANUAL_IMAGE_LOCK_V9' in i,
            'server marker':'AG_MANUAL_IMAGE_LOCK_V9' in s,
            'QAP always resolves':"imagePending: true" in i and "fallbackImg: item.img || item.imgs?.[0] || ''" in i,
            'saved badge':"'SAUVÉE'" in i,
            'manual lazy lock':"if(manual && local){finish(true);return}" in i,
            'QAP source metadata':"sourceUrl:manualOverride.sourceUrl || ''" in s and "manualOverride:true" in s,
            'durable save confirmation':"persistent:true" in s and "octet_length(image_bytes)>=700" in s,
          }
          for name,ok in checks.items():
              print(name, ok)
              if not ok:
                  raise SystemExit('FAILED: '+name)
          PY
      - name: Run transformation regression tests
        run: |
          if [ -f .github/transform-audit.test.cjs ]; then
            node .github/transform-audit.test.cjs
          fi
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/AUDIT_MANUAL_IMAGE_REFRESH.yml
          rm -f .github/workflows/PATCH_MANUAL_IMAGE_LOCK_V9.yml
          rm -f .github/patch_manual_image_lock_v9.py
          git add index.html server.js .github
          git commit -m "fix: permanently lock manual character images after refresh [skip ci]"
          git push origin HEAD:main
