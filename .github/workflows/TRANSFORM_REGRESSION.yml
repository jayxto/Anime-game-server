name: Transformation resolver regression checks

on:
  push:
    paths:
      - 'server.js'
      - '.github/audit-transform.cjs'
      - '.github/transform-audit.test.cjs'
      - '.github/audit_transform_remaining*.py'
      - '.github/workflows/TRANSFORM_REGRESSION.yml'
  pull_request:
    paths:
      - 'server.js'
      - '.github/audit-transform.cjs'
      - '.github/transform-audit.test.cjs'
      - '.github/audit_transform_remaining*.py'
      - '.github/workflows/TRANSFORM_REGRESSION.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check server.js
      - run: node --test .github/transform-audit.test.cjs
      - run: python3 .github/audit_transform_remaining.py
      - run: python3 .github/audit_transform_remaining_v2.py
      - run: python3 .github/audit_transform_remaining_v3.py
