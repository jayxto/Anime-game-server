name: Clean tracked node_modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/CLEAN_TRACKED_NODE_MODULES.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Stop tracking installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          printf 'node_modules/\n.env\n.env.*\n!.env.example\n.DS_Store\nnpm-debug.log*\n' > .gitignore
          git rm -r --cached --ignore-unmatch node_modules
          rm -f .github/workflows/CLEAN_TRACKED_NODE_MODULES.yml
      - name: Verify dependency manifests remain
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          node -e "const p=require('./package.json'); if(!p.scripts?.start) process.exit(1); console.log('start:',p.scripts.start)"
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: stop tracking node_modules [skip ci]"
          git push origin HEAD:main
