name: Extract migration context v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/EXTRACT_MIGRATION_CONTEXT_V2.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Extract migration context
        run: python3 .github/extract_migration_context_v2.py
      - name: Commit context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/simple_migration_context_v2.txt
          git commit -m "chore: extract migration context v2 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
