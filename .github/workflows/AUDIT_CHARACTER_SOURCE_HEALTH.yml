name: Audit verified character source health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_CHARACTER_SOURCE_HEALTH.yml'
      - '.github/audit_character_source_health.py'
      - 'server.js'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Check verified character image URLs
        run: python3 .github/audit_character_source_health.py
      - name: Commit source health report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/character_source_health.txt
          if git diff --cached --quiet; then
            echo 'No source-health changes'
            exit 0
          fi
          git commit -m "chore: audit verified character image sources [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

