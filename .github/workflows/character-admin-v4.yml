name: Character admin images v4

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch-character-admin-v4.py'
      - '.github/workflows/character-admin-v4.yml'

permissions:
  contents: write

concurrency:
  group: character-admin-images-v4
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply character admin v4
        run: python3 scripts/patch-character-admin-v4.py

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check assets/js/ui-refactor.js

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js assets/js/ui-refactor.js
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "feat: persistent character image admin and mode filter"
          git push
