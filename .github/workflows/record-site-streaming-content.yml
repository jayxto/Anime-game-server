name: Capture Anime Game cards and streamer features
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/record-site-streaming-content.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - run: timeout 340s node promo/record-site-streaming-content.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-streamer-and-collection
          path: promo/site-content-output/
          if-no-files-found: warn
