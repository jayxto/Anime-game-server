name: Fix persistent admin image URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/FIX_PERSISTENT_ADMIN_IMAGE_URLS.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch persistent admin image overrides
        run: python3 .github/fix_persistent_images.py

      - name: Verify server syntax
        run: node --check server.js

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/FIX_PERSISTENT_ADMIN_IMAGE_URLS.yml .github/fix_persistent_images.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep admin character image URLs after refresh [skip ci]"
          git push origin HEAD:main
