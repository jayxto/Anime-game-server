name: Image target extract

on:
  push:
    paths:
      - '.github/workflows/IMAGE_TARGET_EXTRACT.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract targeted server sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('server.js').read_text(encoding='utf-8',errors='replace')
          lines=src.splitlines()
          out=[]
          ranges=[(200,900),(11350,11950),(18100,19150),(22350,22950),(23600,23950)]
          for a,b in ranges:
            out.append('\n'+'='*100+f'\nLINES {a}-{b}\n'+'='*100)
            for i in range(max(0,a-1), min(len(lines),b)):
              out.append(f'{i+1}: {lines[i]}')
          out.append('\n'+'='*100+'\nKEYWORD MATCHES\n'+'='*100)
          pats=['cardImg','cardPool','cardResolve','character-images/fill','character-images/status','character-image-file','adminOnly','server.listen','httpServer.listen','listen(','image_bytes','CHARACTER_IMAGE_FILL','fillMissing','AUTO_IMAGE','ALT_ART_CARDS','MOMENT_CARDS','DUO_CARDS','SEASON_CARDS']
          for i,l in enumerate(lines,1):
            if any(p in l for p in pats): out.append(f'{i}: {l[:3000]}')
          Path('IMAGE_TARGET_SNIPPETS.txt').write_text('\n'.join(out),encoding='utf-8')
          print('wrote',len(out),'lines')
          PY
      - name: Commit target snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE_TARGET_SNIPPETS.txt
          git commit -m "audit: targeted card and image snippets"
          git push origin HEAD:image-full-coverage-work
