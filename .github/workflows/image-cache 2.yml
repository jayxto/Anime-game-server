name: Cache anime character images

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Redownload every image even if a local WebP already exists
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'scripts/cache-character-images.mjs'
      - '.github/workflows/image-cache.yml'
      - 'char-images.json'
      - 'qap-themes.json'
      - 'tierlist-themes.json'
      - 'index.html'
      - 'server.js'
      - 'assets/js/**'

permissions:
  contents: write

concurrency:
  group: anime-image-cache
  cancel-in-progress: false

jobs:
  cache-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE_CACHE_CONCURRENCY: '8'
      IMAGE_CACHE_SIZE: '384'
      IMAGE_CACHE_QUALITY: '78'
      IMAGE_CACHE_REFRESH: ${{ inputs.refresh && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image converter
        run: npm install --no-save --package-lock=false sharp@0.33.5

      - name: Download, repair and convert images
        shell: bash
        run: |
          set +e
          node scripts/cache-character-images.mjs
          code=$?
          set -e
          # Exit code 2 only means some images could not be found; the report lists them.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Commit generated image cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            char-images.json \
            qap-themes.json \
            tierlist-themes.json \
            index.html \
            server.js \
            assets/js \
            assets/images \
            image-cache-report.json \
            images-a-verifier.json \
            IMAGE_CACHE_REPORT.md

          if git diff --cached --quiet; then
            echo "No image-cache changes to commit."
            exit 0
          fi

          git commit -m "chore(images): cache anime artwork locally [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
