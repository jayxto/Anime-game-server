name: Patch verified character images V6

on:
  push:
    branches: [image-fix-v6]
    paths:
      - '.github/workflows/PATCH_CHARACTER_IMAGES_V6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-fix-v6
          fetch-depth: 0
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed V6 patch
        run: python3 .github/patch_character_images_v6.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify V6 anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_CHARACTER_ALIASES_V6' server.js
          grep -q 'SIMPLE_VERIFIED_CHARACTER_IMAGES_V6' server.js
          grep -q "cote|kaya ishikura" server.js
          grep -q "cote|tetsuya machida" server.js
          grep -q "cote|reon kondo" server.js
          grep -q "digimon|koshiro izumi" server.js
          grep -q "dragonball|ea" server.js
          grep -q "dragonball|gyumao" server.js
      - name: Commit tested V6 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_character_images_v6.py .github/workflows/PATCH_CHARACTER_IMAGES_V6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: verified character images batch 6 [skip ci]"
          git push origin HEAD:image-fix-v6
