name: Patch verified character images V5

on:
  push:
    branches: [image-fix-v5]
    paths:
      - '.github/workflows/PATCH_CHARACTER_IMAGES_V5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-fix-v5
          fetch-depth: 0
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed V5 image patch
        run: python3 .github/patch_character_images_v5.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify V5 anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_CHARACTER_ALIASES_V5' server.js
          grep -q 'SIMPLE_VERIFIED_CHARACTER_IMAGES_V5' server.js
          grep -q "dgrayman|mana d campbell" server.js
          grep -q "demonslayer|zenitsu s sparrow" server.js
          grep -q "conan|rei furuya" server.js
          grep -q "dragonball|c 14" server.js
          grep -q "dragonball|geene" server.js
          grep -q "dragonball|kaio de l est" server.js
      - name: Commit tested V5 patch on branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_character_images_v5.py .github/workflows/PATCH_CHARACTER_IMAGES_V5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: verified character images batch 5 [skip ci]"
          git push origin HEAD:image-fix-v5
