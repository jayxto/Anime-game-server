name: Fix adminOnly startup order

on:
  push:
    paths:
      - '.github/workflows/FIX_ADMIN_ONLY.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Move admin image route after adminOnly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          start_marker = "app.post('/api/admin/character-image', adminOnly(async (req,res)=>{"
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('admin image route not found')
          end = s.find('\n}));', start)
          if end < 0:
              raise SystemExit('admin image route end not found')
          end += len('\n}));')
          block = s[start:end]
          s = s[:start] + s[end:]
          admin_marker = 'const adminOnly = fn => async (req, res) => {'
          admin = s.find(admin_marker)
          if admin < 0:
              raise SystemExit('adminOnly declaration not found')
          line_end = s.find('\n', admin)
          if line_end < 0:
              raise SystemExit('adminOnly line end not found')
          s = s[:line_end + 1] + '\n' + block + '\n' + s[line_end + 1:]
          admin2 = s.find(admin_marker)
          route2 = s.find(start_marker)
          if route2 <= admin2:
              raise SystemExit(f'bad order admin={admin2} route={route2}')
          p.write_text(s, encoding='utf-8')
          print('adminOnly order fixed:', admin2, route2)
          PY

      - name: Validate server ordering
        run: |
          node --check server.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('server.js','utf8');
          const a=s.indexOf('const adminOnly = fn => async');
          const r=s.indexOf("app.post('/api/admin/character-image', adminOnly");
          if(a<0||r<0||r<=a) throw new Error(`invalid ordering admin=${a} route=${r}`);
          console.log('Validation OK:', {admin:a, route:r});
          NODE

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/FIX_ADMIN_ONLY.yml
          git add server.js
          git commit -m "fix: initialize adminOnly before character image route"
          git pull --rebase origin main
          git push origin HEAD:main
