name: Package two-file export

on:
  push:
    paths:
      - '.github/workflows/PACKAGE_TWO_FILES.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate export
        run: |
          test -s index.html
          test -s server.js
          node --check server.js
      - uses: actions/upload-artifact@v4
        with:
          name: ANIME_GAME_TWO_FILES
          path: |
            index.html
            server.js
          if-no-files-found: error
          compression-level: 6
