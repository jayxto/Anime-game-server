name: Patch character catalogue V8

on:
  push:
    branches: [image-fix-v8]
    paths:
      - '.github/workflows/PATCH_CHARACTER_CATALOG_V8.yml'
      - '.github/patch_character_catalog_v8.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-fix-v8
          fetch-depth: 0
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V8 patch
        run: python3 .github/patch_character_catalog_v8.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify filter and Ukyo source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHARACTER_CATALOG_QAP_FILTER_V8' server.js
          grep -q "\['transformation','arc','isekai','shonen','anime'\]" server.js
          grep -q 'img_33316d797bfecc3a90883fc92118ffc473569.jpg' server.js
          curl -L -sS --fail --max-time 30 -H 'User-Agent: Mozilla/5.0' 'https://times-abema.ismcdn.jp/mwimgs/3/3/724w/img_33316d797bfecc3a90883fc92118ffc473569.jpg' -o /tmp/ukyo.jpg
          test "$(wc -c < /tmp/ukyo.jpg)" -gt 700
      - name: Commit tested V8
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_character_catalog_v8.py .github/workflows/PATCH_CHARACTER_CATALOG_V8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: filter non-character QAP themes and repair Ukyo image [skip ci]"
          git push origin HEAD:image-fix-v8
