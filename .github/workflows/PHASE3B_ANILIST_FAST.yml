name: Phase 3B fast AniList image fill
on:
  push:
    branches: [image-coverage-100-v2]
    paths: [.github/workflows/PHASE3B_ANILIST_FAST.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Boot app and get visual catalog
        env:
          PORT: '3099'
        run: |
          set -euo pipefail
          node server.js >/tmp/server.log 2>&1 & echo $! >/tmp/server.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3099/api/character-catalog -o /tmp/catalog.json && break || true
            sleep 1
          done
          test -s /tmp/catalog.json || { cat /tmp/server.log; exit 1; }
      - name: Resolve and localize with AniList
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),sharp=require('sharp');
          const data=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          const chars=data.characters||data.items||data.catalog||[];
          const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’'`]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const slug=s=>norm(s).replace(/ /g,'-')||'_global';
          const uniq=new Map();
          for(const x of chars){const u=x.universeKey||x.universe||x.u||x.key||x.animeKey||'';const n=x.name||x.character||x.displayName||x.label||'';if(!n)continue;const k=slug(u)+'|'+slug(n);if(!uniq.has(k))uniq.set(k,{...x,u,n});}
          const exts=['.webp','.png','.jpg','.jpeg'];
          const exists=x=>exts.some(e=>{const f=path.join('music','char-images',slug(x.u),slug(x.n)+e);return fs.existsSync(f)&&fs.statSync(f).size>700});
          const outFile=x=>path.join('music','char-images',slug(x.u),slug(x.n)+'.webp');
          const missing=[...uniq.values()].filter(x=>!exists(x));
          const generic=new Set(['anime','shonen','isekai','seinen','shojo','sport','sports','film','movie']);
          const isTitle=x=>!x.u && generic.has(norm(x.anime));
          const titles=missing.filter(isTitle), people=missing.filter(x=>!isTitle(x));
          console.log('START',uniq.size,'MISSING',missing.length,'CHAR',people.length,'TITLE',titles.length);
          const score=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 100;if(a.replace(/ /g,'')===b.replace(/ /g,''))return 98;if(a.includes(b)||b.includes(a)){const mn=Math.min(a.length,b.length),mx=Math.max(a.length,b.length);if(mn>=4)return 75+Math.round(20*mn/mx);}const A=new Set(a.split(' ')),B=new Set(b.split(' '));let c=0;for(const z of A)if(B.has(z))c++;return Math.round(c/Math.max(A.size,B.size,1)*80)};
          const mediaScore=(nodes,w)=>{let best=0;for(const m of nodes||[])for(const t of [m?.title?.romaji,m?.title?.english,m?.title?.native].filter(Boolean))best=Math.max(best,score(t,w));return best};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function gql(query,variables){for(let a=1;a<=3;a++){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),12000);try{const r=await fetch('https://graphql.anilist.co',{method:'POST',signal:ac.signal,headers:{'content-type':'application/json','accept':'application/json','user-agent':'AnimeGameCoverage/3B'},body:JSON.stringify({query,variables})});if(r.status===429){await sleep(1800*a);continue;}if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return j.data||{};}catch(e){if(a===3)return {};await sleep(700*a);}finally{clearTimeout(timer);}}return {};}
          function makeCharQuery(chunk){const vars={},defs=[],fields=[];chunk.forEach((x,i)=>{vars['s'+i]=x.n;defs.push(`$s${i}:String`);fields.push(`c${i}:Character(search:$s${i}){name{full native alternative}image{large medium}media(perPage:8){nodes{title{romaji english native}}}}`)});return {vars,q:`query(${defs.join(',')}){${fields.join('\n')}}`};}
          function makeMediaQuery(chunk){const vars={},defs=[],fields=[];chunk.forEach((x,i)=>{vars['s'+i]=x.n;defs.push(`$s${i}:String`);fields.push(`m${i}:Media(search:$s${i},type:ANIME){title{romaji english native}coverImage{extraLarge large medium}}`)});return {vars,q:`query(${defs.join(',')}){${fields.join('\n')}}`};}
          async function resolveChunks(list,kind){const chunks=[];for(let i=0;i<list.length;i+=10)chunks.push(list.slice(i,i+10));let next=0;const found=[];async function worker(id){while(true){const ci=next++;if(ci>=chunks.length)return;const chunk=chunks[ci],pack=kind==='char'?makeCharQuery(chunk):makeMediaQuery(chunk);const d=await gql(pack.q,pack.vars);for(let i=0;i<chunk.length;i++){const x=chunk[i];if(kind==='char'){const c=d['c'+i];if(!c)continue;const ns=[c?.name?.full,c?.name?.native,...(c?.name?.alternative||[])].filter(Boolean);const nscr=Math.max(0,...ns.map(v=>score(v,x.n)));const ascr=mediaScore(c?.media?.nodes,x.anime||x.universeName||x.u||'');if(nscr>=92||(nscr>=72&&ascr>=45)){const url=c?.image?.large||c?.image?.medium;if(url)found.push({x,url,nscr,ascr,kind});}}else{const m=d['m'+i];if(!m)continue;const ts=[m?.title?.romaji,m?.title?.english,m?.title?.native].filter(Boolean);const scr=Math.max(0,...ts.map(v=>score(v,x.n)));const url=m?.coverImage?.extraLarge||m?.coverImage?.large||m?.coverImage?.medium;if(url&&scr>=65)found.push({x,url,nscr:scr,ascr:100,kind});}}if(ci%10===0)console.log('RESOLVE',kind,ci,'/',chunks.length,'FOUND',found.length);await sleep(450);}}
            await Promise.all([worker(0),worker(1)]);return found;}
          async function download(it){const out=outFile(it.x);fs.mkdirSync(path.dirname(out),{recursive:true});for(let a=1;a<=3;a++){const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),12000);try{const r=await fetch(it.url,{redirect:'follow',signal:ac.signal,headers:{'user-agent':'Mozilla/5.0 AnimeGameCoverage/3B','accept':'image/*'}});if(!r.ok)throw new Error('HTTP '+r.status);const b=Buffer.from(await r.arrayBuffer());if(b.length<700)throw new Error('small');const tmp=out+'.tmp';await sharp(b,{animated:false}).rotate().resize({width:420,height:588,fit:'inside',withoutEnlargement:true}).webp({quality:74,effort:4}).toFile(tmp);if(fs.statSync(tmp).size<700)throw new Error('small out');fs.renameSync(tmp,out);return true;}catch(e){if(a===3)return false;await sleep(400*a);}finally{clearTimeout(timer);}}return false;}
          (async()=>{const a=await resolveChunks(people,'char');const b=await resolveChunks(titles,'media');const map=new Map();for(const r of [...a,...b])map.set(slug(r.x.u)+'|'+slug(r.x.n),r);const todo=[...map.values()];console.log('CANDIDATES',todo.length);let p=0,ok=0,fail=0;async function dw(){while(true){const i=p++;if(i>=todo.length)return;if(await download(todo[i]))ok++;else fail++;if(i%100===0)console.log('DOWNLOAD',i,'/',todo.length,ok,fail);}}await Promise.all(Array.from({length:14},dw));let have=0;const rem=[];for(const x of uniq.values()){if(exists(x))have++;else rem.push({u:x.u,n:x.n,anime:x.anime||'',sources:x.sources||[]});}const report={total:uniq.size,startMissing:missing.length,candidates:todo.length,downloaded:ok,failed:fail,canonical:have,missing:rem.length,coverage:+(have*100/uniq.size).toFixed(2),missingFirst1000:rem.slice(0,1000)};fs.writeFileSync('PHASE3B_IMAGE_REPORT.json',JSON.stringify(report,null,2));console.log('RESULT',report.total,report.canonical,report.missing,report.coverage+'%');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify and commit
        run: |
          set -euo pipefail
          node --check server.js
          kill $(cat /tmp/server.pid) 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/char-images PHASE3B_IMAGE_REPORT.json
          git commit -m "fix: phase3b localize AniList images" || true
          git push origin HEAD:image-coverage-100-v2
      - uses: actions/upload-artifact@v4
        with:
          name: phase3b-image-report
          path: |
            PHASE3B_IMAGE_REPORT.json
            /tmp/server.log
