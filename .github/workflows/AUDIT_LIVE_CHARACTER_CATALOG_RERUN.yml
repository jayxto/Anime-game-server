name: Audit live character image catalog rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_LIVE_CHARACTER_CATALOG_RERUN.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false
      - name: Wait briefly for Render
        run: sleep 20
      - name: Fetch current live character catalogue
        run: python3 .github/audit_live_character_catalog.py
      - name: Commit current audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/live_character_catalog_audit.json .github/live_character_catalog_summary.txt
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "chore: refresh live character image audit [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

# rerun: 2026-10-03 after verified character batch 5 and transform health pass
