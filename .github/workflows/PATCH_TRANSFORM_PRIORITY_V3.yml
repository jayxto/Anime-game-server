name: Patch transformation priority V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_PRIORITY_V3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch strict transformation priority
        run: python3 .github/patch_transform_priority_v3.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const persistKey = `v3|' server.js
          grep -q "it.img && source !== 'qt:transformation'" server.js
          grep -q 'reviewed source always override it' server.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_priority_v3.py .github/workflows/PATCH_TRANSFORM_PRIORITY_V3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce verified transformation image priority v3 [skip ci]"
          git push origin HEAD:main
