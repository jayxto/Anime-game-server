name: Patch character catalog cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_CHARACTER_CATALOG_CLEANUP.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clean character catalogue ingestion
        run: python3 .github/patch_character_catalog_cleanup.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify cleanup anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHARACTER_CATALOG_CLEANUP_V2' server.js
          grep -q 'almost certainly an anime/category item' server.js
          grep -q "u === 'fate'" server.js
          grep -q "u === 'soul'" server.js
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_character_catalog_cleanup.py .github/workflows/PATCH_CHARACTER_CATALOG_CLEANUP.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: clean character catalog and universe aliases [skip ci]"
          git push origin HEAD:main
