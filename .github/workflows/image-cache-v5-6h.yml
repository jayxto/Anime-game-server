name: Cache anime character images

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Redownload even when some cached files already exist'
        required: false
        default: 'false'
      deep:
        description: 'Use deep search mode'
        required: false
        default: 'true'
  push:
    paths:
      - 'scripts/cache-character-images.mjs'

permissions:
  contents: write

concurrency:
  group: anime-image-cache-main
  cancel-in-progress: true

jobs:
  cache-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install image converter
        run: npm install sharp

      - name: Download, repair, checkpoint and convert images
        env:
          IMAGE_CACHE_REFRESH: ${{ inputs.refresh == 'true' && '1' || '0' }}
          IMAGE_CACHE_DEEP: ${{ inputs.deep == 'false' && '0' || '1' }}
          IMAGE_CACHE_CONCURRENCY: '6'
          IMAGE_CACHE_SIZE: '384'
          IMAGE_CACHE_QUALITY: '80'
          IMAGE_CACHE_CHECKPOINT_EVERY: '25'
        run: node scripts/cache-character-images.mjs --deep

      - name: Commit final reports and rewrites
        if: always()
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No final changes to commit"
            exit 0
          fi
          git commit -m "chore: finalize image cache run"
          git push
