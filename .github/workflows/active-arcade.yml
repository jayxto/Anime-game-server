name: Record active Anime Game arcade matches
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/active-arcade.yml'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - name: Play each real arcade mode
        run: timeout 660s node promo/active-modes.js
        env:
          GROUP: arcade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-live-arcade
          path: promo/live-arcade/
          if-no-files-found: warn
