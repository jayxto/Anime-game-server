name: Test real images runtime

on:
  push:
    branches: [real-image-fix]

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Boot and test image HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          PORT=3210 NODE_ENV=test node server.js >/tmp/anime-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3210/api/local-image-cache-status >/tmp/status.json 2>/dev/null; then READY=1; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo 'SERVER CRASHED'; cat /tmp/anime-server.log; exit 1; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then echo 'SERVER DID NOT BECOME READY'; cat /tmp/anime-server.log; exit 1; fi
          cat /tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          assert d.get('ok') is True
          assert d.get('files',0) >= 1000, d
          PY

          curl -fsS -D /tmp/static.h -o /tmp/static.img http://127.0.0.1:3210/assets/images/chars/bleach/ichigo-kurosaki.webp
          STATIC_BYTES=$(wc -c </tmp/static.img | tr -d ' ')
          test "$STATIC_BYTES" -gt 1000
          grep -qi 'content-type: image/' /tmp/static.h

          curl -fsS -D /tmp/local.h -o /tmp/local.img 'http://127.0.0.1:3210/api/local-character-image?u=bleach&n=Ichigo%20Kurosaki'
          LOCAL_BYTES=$(wc -c </tmp/local.img | tr -d ' ')
          test "$LOCAL_BYTES" -gt 1000
          grep -qi 'content-type: image/' /tmp/local.h

          printf 'RUNTIME IMAGE TEST\nstatus=OK\nstatic_bytes=%s\nlocal_api_bytes=%s\n' "$STATIC_BYTES" "$LOCAL_BYTES" >/tmp/RUNTIME_IMAGE_TEST.txt

          for URL in \
            'http://127.0.0.1:3210/api/character-image?u=bleach&n=Ichigo%20Kurosaki' \
            'http://127.0.0.1:3210/api/avatar/img?u=bleach&n=Ichigo%20Kurosaki'; do
            echo "--- $URL" >>/tmp/RUNTIME_IMAGE_TEST.txt
            curl -sS -L --max-time 15 -D /tmp/route.h -o /tmp/route.body "$URL" || true
            head -n 8 /tmp/route.h >>/tmp/RUNTIME_IMAGE_TEST.txt || true
            echo "body_bytes=$(wc -c </tmp/route.body 2>/dev/null || echo 0)" >>/tmp/RUNTIME_IMAGE_TEST.txt
            head -c 300 /tmp/route.body >>/tmp/RUNTIME_IMAGE_TEST.txt || true
            echo >>/tmp/RUNTIME_IMAGE_TEST.txt
          done
          cat /tmp/RUNTIME_IMAGE_TEST.txt
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-test
          path: |
            /tmp/RUNTIME_IMAGE_TEST.txt
            /tmp/status.json
            /tmp/anime-server.log
      - name: Clean workflow from branch
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/TEST_REAL_IMAGES_RUNTIME.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove runtime test workflow [skip ci]"
          git push origin HEAD:real-image-fix
