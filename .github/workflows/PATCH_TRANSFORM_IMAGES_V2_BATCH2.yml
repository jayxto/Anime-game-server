name: Patch verified transformation images V2 batch 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_IMAGES_V2_BATCH2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add second verified image batch
        run: python3 .github/patch_transform_images_v2_batch2.py

      - name: Verify server syntax
        run: node --check server.js

      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH2' server.js
          grep -q 'dragon-ball-super-vegeta-ultra-ego.jpg' server.js
          grep -q 'SHF%20ORANGE%20PICCOLO_01.jpg' server.js
          grep -q 'afea49694e24409dbca3a7924b978389.jpeg' server.js

      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_images_v2_batch2.py .github/workflows/PATCH_TRANSFORM_IMAGES_V2_BATCH2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 2 [skip ci]"
          git push origin HEAD:main

# rerun: separator fix validated before commit
