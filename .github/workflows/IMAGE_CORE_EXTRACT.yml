name: Image core extract

on:
  push:
    paths:
      - '.github/workflows/IMAGE_CORE_EXTRACT.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact core snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('server.js').read_text(encoding='utf-8',errors='replace')
          lines=src.splitlines()
          anchors=[
            "app.get('/api/character-catalog'",
            "app.get('/api/character-image'",
            "app.get('/api/character-image-file'",
            "app.get('/api/character-image-stats'",
            "app.get('/api/admin/character-images/status'",
            "app.post('/api/admin/character-images/fill'",
            "app.post('/api/admin/character-image'",
            'function cardImg',
            'const cardImg',
            'function cardPool',
            'const cardPool',
            'function cardResolve',
            'const cardResolve',
            'function cardInfoOfKey',
            "app.get('/api/cards'",
            'const ARC_UNIVERSE_ANIME',
            'const QT_BY_ID',
            'const RG_POOLS_V2',
            'const DLE_MASTER_NAMES',
            'function buildCharacter',
            'const buildCharacter',
            'characterImageFill',
            'fillMissingCharacter',
            'IMAGE_FILL',
            'simpleImageRoute',
            'simpleStoreImage',
            'simpleFetchImage'
          ]
          out=[]
          for anchor in anchors:
            hit=[i for i,l in enumerate(lines) if anchor in l]
            if not hit: continue
            for idx in hit[:6]:
              out.append('\n'+'='*100)
              out.append(f'ANCHOR {anchor!r} @ line {idx+1}')
              out.append('='*100)
              a=max(0,idx-45); b=min(len(lines),idx+110)
              for j in range(a,b): out.append(f'{j+1}: {lines[j]}')
          # card/image declaration index
          out.append('\n'+'='*100+'\nDECLARATION INDEX\n'+'='*100)
          for i,l in enumerate(lines,1):
            if re.search(r'\b(?:function|const|let|var)\s+[A-Za-z_$][\w$]*(?:card|image|character|catalog)[A-Za-z0-9_$]*',l,re.I):
              out.append(f'{i}: {l[:1500]}')
          Path('IMAGE_CORE_SNIPPETS.txt').write_text('\n'.join(out),encoding='utf-8')
          print('wrote',len(out),'lines')
          PY
      - name: Commit snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMAGE_CORE_SNIPPETS.txt
          git commit -m "audit: exact image and card core snippets"
          git push origin HEAD:image-full-coverage-work
