name: Patch visually verified character images v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_VERIFIED_CHARACTERS_VISUAL_V7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply visually verified replacements
        run: python3 .github/patch_verified_characters_visual_v7.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify image endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          urls=[
            'https://cdn.rafled.com/anime-icons/images/b23f2b0117002d3e968e41fb65b936dd5221edf3db3279309f3664dad09726a6.jpg',
            'https://i.pinimg.com/736x/bf/ef/b6/bfefb69ca7516bb5e42f7e3f80626f11.jpg',
            'https://img2.wikia.nocookie.net/__cb20140401054309/cowboybebop/images/2/25/CL_Vincent.png',
            'https://i.pinimg.com/736x/fd/f5/5f/fdf55f513dc40101f7c1e6605dd11f6f.jpg',
            'https://bleach-anime.com/assets/img/character/face_58.png',
            'https://fr.dragon-ball-official.com/dragonball/jp/news/2023/11/chara136_2.jpg?_=1773153000',
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-4095','Accept':'image/*'})
            with urllib.request.urlopen(req,timeout=20) as r:
              ct=(r.headers.get('Content-Type') or '').lower()
              if r.status not in (200,206) or not ct.startswith('image/'):
                raise SystemExit(f'bad image response {r.status} {ct} {url}')
              print(r.status,ct,url)
          PY
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_VERIFIED_CHARACTER_VISUAL_BATCH7' server.js
          grep -q 'b23f2b0117002d3e968e41fb65b936dd' server.js
          grep -q 'CL_Vincent.png' server.js
          grep -q 'face_58.png' server.js
          grep -q 'chara136_2.jpg' server.js
      - name: Commit verified image batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_verified_characters_visual_v7.py .github/workflows/PATCH_VERIFIED_CHARACTERS_VISUAL_V7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: visually verify character portraits v7 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
