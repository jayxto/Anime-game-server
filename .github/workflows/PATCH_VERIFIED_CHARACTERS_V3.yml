name: Patch verified characters V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_VERIFIED_CHARACTERS_V3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed character batch 3
        run: python3 .github/patch_verified_characters_v3.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_ALIAS_BATCH_IMAGE_V3' server.js
          grep -q 'SIMPLE_VERIFIED_CHARACTER_IMAGES_V3' server.js
          grep -q "'clannad|tomoya debut':'Tomoya Okazaki'" server.js
          grep -q "'danmachi|aiz wallenstein':'Ais Wallenstein'" server.js
          grep -q 'dgrayman-anime.com/images/chara4.png' server.js
          grep -q 'Typhoon_Devil_Reze_Arc_anime_design.png' server.js
          grep -q 'vincent volaju' server.js
      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_verified_characters_v3.py .github/workflows/PATCH_VERIFIED_CHARACTERS_V3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add verified character image batch 3 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
