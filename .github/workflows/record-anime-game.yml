name: Record real Anime Game streamer video
on:
  push:
    branches: [streamer-gameplay-presentation-2026]
    paths:
      - '.github/workflows/record-anime-game.yml'
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: streamer-gameplay-presentation-2026
          sparse-checkout: |
            promo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1 && npx playwright install chromium --with-deps
      - name: Capture live Anime Game website
        run: timeout 380s node promo/record-anime-game.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-game-streamer-video
          path: promo/record-output/
          if-no-files-found: warn
