name: Patch verified transformation batch 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source images are reachable
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://syimg.3dmgame.com/uploadimg/upload/image/20190613/20190613113752_50251.jpg'
            'https://st1.uvnimg.com/40/08/a92992212e8231c21f294d1e8a61/gohanss2.jpg'
            'https://vignette.wikia.nocookie.net/dragonuniverse/images/9/96/Super_Saiyan_Blue_Goku_%28Broly%29.jpeg/revision/latest?cb=20181126041421'
            'https://i.pinimg.com/564x/8c/c7/52/8cc75270132593a4f9780b3b0e2118ec.jpg'
            'https://staticg.sportskeeda.com/editor/2024/05/c1a53-17158021944739.png'
            'https://elcomercio.pe/resizer/v2/UOIXAPLJMREAHAHVKIO7OHKBDQ.png?auth=5323d4f9f1047d710a674125f4fa16933286d5a2b916dd65c1a2765811fc8e29&height=1200&quality=75&smart=true&width=1600'
            'https://pbs.twimg.com/media/F78zdwQXYAAmf5X?format=jpg&name=large'
            'https://cdn.alfabetajuega.com/alfabetajuega/2022/07/my-hero-academia-shigaraki-bakugo.png?width=1200'
            'https://www.pinkvilla.com/images/2024-07/1720871196_kajiu-no-8-chapter-111-kafka-beserk-2.jpg'
            'https://i.pinimg.com/originals/9c/f8/34/9cf83450d6ebd6d960373d876d23278d.jpg'
            'https://i0.wp.com/chromaticdreamers.com/wp-content/uploads/2023/11/l-intro-1665507300.jpg?resize=1200%2C675&ssl=1'
            'https://i.pinimg.com/736x/40/58/ca/4058ca094703e680e9000b016a955b6c.jpg'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl -L --fail --silent --show-error --max-time 20 -A 'Mozilla/5.0' -o /dev/null "$url"
          done
      - name: Apply batch 6
        run: python3 .github/patch_transform_batch6.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH6' server.js
          grep -q "needs:\['goku','super saiyan blue'\]" server.js
          grep -q "needs:\['luffy','gear 2'\]" server.js
          grep -q "needs:\['killua','godspeed'\]" server.js
          grep -q "needs:\['tanjiro','demon mark'\]" server.js
          grep -q "needs:\['sukuna','true form'\]" server.js
          grep -q "needs:\['kafka','kaiju no 8'\]" server.js
          grep -q "needs:\['garou','cosmic fear'\]" server.js
      - name: Commit verified batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch6.py .github/workflows/PATCH_TRANSFORM_BATCH6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 6 [skip ci]"
          git push origin HEAD:main
