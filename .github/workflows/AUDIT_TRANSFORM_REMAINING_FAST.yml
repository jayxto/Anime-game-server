name: Audit remaining transformations fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_TRANSFORM_REMAINING_FAST.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Build remaining report
        run: python3 .github/audit_transform_remaining_v2.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/remaining_transform_report.txt
          git commit -m "chore: write remaining transformation audit fast [skip ci]"
          git push origin HEAD:main
