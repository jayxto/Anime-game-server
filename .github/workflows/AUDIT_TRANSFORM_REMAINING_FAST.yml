name: Audit remaining transformations fast

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - '.github/audit_transform_remaining_v3.py'
      - '.github/workflows/AUDIT_TRANSFORM_REMAINING_FAST.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - name: Build remaining report
        run: python3 .github/audit_transform_remaining_v3.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/remaining_transform_report.txt
          if git diff --cached --quiet; then
            echo "No audit report changes"
            exit 0
          fi
          git commit -m "chore: refresh remaining transformation audit [skip ci]"
          git push origin HEAD:main

# manual refresh after verified batches 6 and 7
