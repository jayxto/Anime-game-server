name: Patch visually verified character images v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_VERIFIED_CHARACTERS_VISUAL_V6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply visually verified replacements
        run: python3 .github/patch_verified_characters_visual_v6.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify image endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          urls=[
            'https://cdn.anime-planet.com/characters/primary/niko-hirata-1.webp?t=1660955578',
            'https://i.pinimg.com/736x/55/a7/ca/55a7ca3cce0a606d39510bec1e982ad3.jpg',
            'https://static.zerochan.net/Reze.1024.4599201.webp',
            'https://i1.sndcdn.com/artworks-kzBn7kymKFnU1jEz-ho78oQ-t1080x1080.jpg',
            'https://i.pinimg.com/736x/28/35/f0/2835f07d35ae947b3f3204690346f32f.jpg',
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-4095','Accept':'image/*'})
            with urllib.request.urlopen(req,timeout=20) as r:
              ct=(r.headers.get('Content-Type') or '').lower()
              if r.status not in (200,206) or not ct.startswith('image/'):
                raise SystemExit(f'bad image response {r.status} {ct} {url}')
              print(r.status,ct,url)
          PY
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SIMPLE_VERIFIED_CHARACTER_VISUAL_BATCH6' server.js
          grep -q 'niko-hirata-1.webp' server.js
          grep -q 'Reze.1024.4599201.webp' server.js
          grep -q 'artworks-kzBn7kymKFnU1jEz-ho78oQ' server.js
          grep -q '2835f07d35ae947b3f3204690346f32f.jpg' server.js
      - name: Commit verified image batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_verified_characters_visual_v6.py .github/workflows/PATCH_VERIFIED_CHARACTERS_VISUAL_V6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: visually verify ambiguous character portraits v6 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

# rerun: fetchable Muken Aizen source
