name: Patch verified transformation batch 9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_TRANSFORM_BATCH9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source images are reachable
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://gamemag.ru/images/imagemanager/cache/cb/e00e/cbe00e_devilman-crybaby.jpg'
            'https://abrakadabra.fun/uploads/posts/2022-03/1646914049_27-abrakadabra-fun-p-kaneki-s-kagune-sorokonozhki-43.jpg'
            'https://ogre.natalie.mu/media/news/comic/2019/0209/02.jpg?imdensity=1&impolicy=lt&imwidth=1000'
            'https://www.cultture.com/pics/2020/09/perros-callejeros-bungou-las-15-mejores-habilidades-clasificadas-de-mas-debiles-a-mas-fuertes-12.jpg'
            'https://static.zerochan.net/Reg.%28Made.in.Abyss%29.full.3994517.jpg'
            'https://imgix.ranker.com/user_node_img/50146/1002916968/original/1002916968-photo-u-1292046586?auto=format&dpr=2&fit=crop&fm=pjpg&q=60&w=500'
            'https://cdn.oneesports.id/cdn-data/sites/2/2024/03/Tensura-Rimuru-Demon-Lord.jpg'
            'https://admin.esports.gg/wp-content/uploads/2025/04/anime-of-the-year-968x544.jpg'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl -L --fail --silent --show-error --max-time 20 -A 'Mozilla/5.0' -o /dev/null "$url"
          done
      - name: Apply batch 9
        run: python3 .github/patch_transform_batch9.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify batch anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QAP_VERIFIED_TRANSFORM_BATCH9' server.js
          grep -q "needs:\['akira','devilman'\]" server.js
          grep -q "needs:\['kaneki','centipede'\]" server.js
          grep -q "needs:\['lelouch','zero'\]" server.js
          grep -q "needs:\['chuya','corruption'\]" server.js
          grep -q "needs:\['reg','incinerator'\]" server.js
          grep -q "needs:\['zodd','apostle'\]" server.js
          grep -q "needs:\['rimuru','demon lord'\]" server.js
          grep -q "needs:\['sung jinwoo','shadow monarch'\]" server.js
      - name: Refresh transformation audit
        run: python3 .github/audit_transform_remaining_v3.py
      - name: Commit verified batch and audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_transform_batch9.py .github/workflows/PATCH_TRANSFORM_BATCH9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add verified transformation image batch 9 [skip ci]"
          git push origin HEAD:main
