name: Hotfix character stabilizer v7

on:
  push:
    paths:
      - '.github/workflows/hotfix-character-stabilizer-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bound external API retries and timeouts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/stabilize-character-images-v5.mjs')
          s = p.read_text(encoding='utf-8')
          old = "if(r.status===429){await sleep(2500);page--;continue}"
          new = "if(r.status===429){await sleep(1800);break}"
          if old not in s:
              raise SystemExit('AniList retry anchor not found')
          s = s.replace(old, new, 1)
          # Keep every secondary lookup bounded so one dead wiki/API cannot hold the whole run.
          s = s.replace("},8000);if(!r.ok)return '';const pages", "},5500);if(!r.ok)return '';const pages", 1)
          s = s.replace("},9000));if(r.status===429)return '';", "},6000));if(r.status===429)return '';", 1)
          s = s.replace("},8000);if(!r.ok)return '';let best", "},5500);if(!r.ok)return '';let best", 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/stabilize-character-images-v5.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stabilize-character-images-v5.mjs
          git commit -m "fix: prevent image resolver retry stalls"
          git pull --rebase origin main
          git push origin HEAD:main
