name: Patch catalog route canonical V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_CATALOG_ROUTE_CANONICAL_V3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch catalog route canonicalization
        run: python3 .github/patch_catalog_route_canonical_v3.py
      - name: Verify server syntax
        run: node --check server.js
      - name: Verify anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CHARACTER_CATALOG_ROUTE_CANONICAL_V3' server.js
          grep -q "fateroute','heavensfeel','unlimitedbladeworks" server.js
          grep -q "u === 'fate'" server.js
          grep -q "u === 'soul'" server.js
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_catalog_route_canonical_v3.py .github/workflows/PATCH_CATALOG_ROUTE_CANONICAL_V3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: canonicalize character catalog after resolution [skip ci]'
          git push origin HEAD:main
