name: Audit character catalog loops v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/AUDIT_CATALOG_LOOPS_V5.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server.js
            .github
          sparse-checkout-cone-mode: false
      - run: python3 .github/audit_catalog_loops_v5.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/catalog_loops_v5.txt
          git commit -m "chore: write character catalog loop audit v5 [skip ci]"
          git push origin HEAD:main
