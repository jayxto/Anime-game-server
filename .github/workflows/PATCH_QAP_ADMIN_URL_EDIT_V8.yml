name: Patch QAP admin URL editing v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PATCH_QAP_ADMIN_URL_EDIT_V8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            server.js
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply QAP admin URL edit patch
        run: python3 .github/patch_qap_admin_url_edit_v8.py
      - name: Verify syntax and UI wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          grep -q 'AG_QAP_ADMIN_URL_EDIT_V8' index.html
          grep -q 'AG_QAP_MANUAL_OVERRIDE_V8' server.js
          grep -q "qapUrlInput.readOnly = false" index.html
          grep -q "getCachedCharacterImage(overrideSource, overrideName)" server.js
          ! grep -q "card.querySelector('\[data-save\]').remove();" index.html
          ! grep -q "card.querySelector('\[data-url\]').readOnly = true;" index.html
          git diff --check
      - name: Verify manual QAP override beats embedded image
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const source=fs.readFileSync('server.js','utf8');
          const start=source.indexOf("app.get('/api/arcade/item-image',");
          const end=source.indexOf('\n});',start)+4;
          assert.ok(start>=0 && end>start,'item-image route missing');
          const route=source.slice(start,end);

          async function run(saved){
            let handler,response,lookupArgs=null,cacheControl=null;
            const it={name:'QAP Override Probe',char:'Probe',sub:'Probe • Naruto',img:'https://example.com/embedded.png'};
            const context=vm.createContext({
              app:{get:(_path,fn)=>{handler=fn;}},
              QAP_ITEM_IMAGE_CACHE:new Map(),
              arcItemsFor:()=>[it],
              normalizeImageKey:value=>String(value||'').toLowerCase(),
              FANDOM_UNIVERSE_ALIASES:{naruto:'naruto'}, FANDOM_WIKIS:{naruto:'example.com'},
              getCachedCharacterImage:async(...args)=>{lookupArgs=args;return saved;},
              qapVerifiedTransformSource:()=>null,
              persistQapTransformImage:async()=>null,
              fetchFandomTransformationImage:async()=>null,
              qapAniListCharacterImage:async()=>null,
              console, Date
            });
            vm.runInContext(route,context);
            await handler({query:{source:'qt:rival',name:it.name}}, {
              set:(_k,v)=>{cacheControl=v;},
              json:v=>{response=JSON.parse(JSON.stringify(v));}
            });
            return {response,lookupArgs,cacheControl,it};
          }

          (async()=>{
            const manual=await run({imageUrl:'/api/image/manual-override'});
            assert.deepEqual(manual.lookupArgs,['qt:rival',manual.it.name]);
            assert.deepEqual(manual.response,{ok:true,imageUrl:'/api/image/manual-override'});
            assert.equal(manual.cacheControl,'no-store');

            const fallback=await run(null);
            assert.deepEqual(fallback.lookupArgs,['qt:rival',fallback.it.name]);
            assert.deepEqual(fallback.response,{ok:true,imageUrl:'https://example.com/embedded.png'});
            assert.equal(fallback.cacheControl,'no-store');
            console.log('QAP manual override priority verified');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Run transformation regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/transform-audit.test.cjs
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patch_qap_admin_url_edit_v8.py \
            .github/workflows/PATCH_QAP_ADMIN_URL_EDIT_V8.yml \
            .github/workflows/AUDIT_QAP_MANUAL_OVERRIDE_KEY.yml \
            .github/workflows/AUDIT_QAP_ITEM_IMAGE_ROUTE.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: allow persistent URL editing in Qui a le plus [skip ci]"
          git push origin HEAD:main
