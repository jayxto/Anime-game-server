name: Patch canonical character images v11
on:
  push:
    paths:
      - '.github/workflows/PATCH_CANONICAL_CHARACTER_IMAGES_V11.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decode patch
        run: |
          cat > /tmp/patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/patch.gz.b64 | gzip -d > /tmp/patch.py
      - name: Apply canonical image patch
        run: python /tmp/patch.py
      - name: Keep QAP route standalone-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text(encoding='utf-8')
          old="const canonicalManual = await simpleManualCharacterImage(baseU, charName, animeName);"
          new="const canonicalManual = typeof simpleManualCharacterImage === 'function' ? await simpleManualCharacterImage(baseU, charName, animeName) : null;"
          if old not in s:
              raise SystemExit('canonical QAP helper call not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify syntax and invariants
        run: |
          node --check server.js
          python - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          checks={
            'canonical marker':'AG_CANONICAL_CHARACTER_IMAGE_V11' in s,
            'identity helper':'function simpleCanonicalCharacterIdentity' in s,
            'manual helper':'async function simpleManualCharacterImage' in s,
            'transform exact only':"if (id.transformation)" in s and "overrideSource === 'qt:transformation'" in s,
            'qap normal canonical':'canonicalManual = await simpleManualCharacterImage' in s,
            'qap old early override restricted':"if (overrideSource === 'qt:transformation' && overrideName)" in s,
            'avatar local bypass':"character-image-file|local-character-image" in s and "return res.redirect(url)" in s,
            'canonical persistent catalog':"simpleCanonicalCharacterIdentity(u,name,raw?.anime || '')" in s,
            'admin context':"isTransformation:x.themeSource==='qt:transformation'" in i,
            'qap anime context':"'&anime=' + encodeURIComponent(item.anime || '')" in i,
          }
          for name,ok in checks.items():
              print(name,ok)
              if not ok: raise SystemExit('FAILED: '+name)
          PY
      - name: Run transformation regression tests
        run: |
          if [ -f .github/transform-audit.test.cjs ]; then
            node .github/transform-audit.test.cjs
          fi
      - name: Commit tested canonical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/AUDIT_CANONICAL_CHARACTER_IMAGES.yml
          rm -f .github/workflows/PATCH_CANONICAL_CHARACTER_IMAGES_V11.yml
          git add server.js index.html .github/workflows
          git commit -m "fix: make manual normal character images canonical everywhere [skip ci]"
          git push origin HEAD:main
